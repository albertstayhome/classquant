<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14050e"/>
      <stop offset="45%" stop-color="#260b1a"/>
      <stop offset="100%" stop-color="#0b192c"/>
    </linearGradient>
    <linearGradient id="goldSlash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="tacticalGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#fbbf24" stroke-width="0.4" stroke-opacity="0.16"/>
      <circle cx="24" cy="24" r="0.8" fill="#38bdf8" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="800" height="160" fill="url(#bgGrad)"/>
  <rect width="800" height="160" fill="url(#tacticalGrid)"/>
  <!-- Diagonal Manga / JJK Domain Slash Polygons -->
  <polygon points="0,145 280,0 315,0 35,160 0,160" fill="#e11d48" fill-opacity="0.14"/>
  <polygon points="490,0 535,0 265,160 220,160" fill="#fbbf24" fill-opacity="0.1"/>
  <polygon points="620,0 800,0 800,160 510,160" fill="#0284c7" fill-opacity="0.15"/>
  <!-- Glowing Energy Slash Lines -->
  <line x1="0" y1="156" x2="800" y2="156" stroke="url(#goldSlash)" stroke-width="2.5"/>
  <line x1="180" y1="0" x2="40" y2="160" stroke="#fde047" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="560" y1="0" x2="440" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Hunter x Hunter Nen Hexagon Ring Watermark -->
  <g transform="translate(680, 80)" opacity="0.32">
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" stroke="#fde047" stroke-width="2" fill="none"/>
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <line x1="0" y1="-58" x2="0" y2="58" stroke="#fbbf24" stroke-width="0.9"/>
    <line x1="-50" y1="-29" x2="50" y2="29" stroke="#fbbf24" stroke-width="0.9"/>
    <line x1="-50" y1="29" x2="50" y2="-29" stroke="#fbbf24" stroke-width="0.9"/>
  </g>
  <!-- Jujutsu Kaisen Cursed Vortex Ring Watermark -->
  <g transform="translate(110, 80)" opacity="0.24">
    <circle cx="0" cy="0" r="54" stroke="#f43f5e" stroke-width="2" stroke-dasharray="10 5"/>
    <circle cx="0" cy="0" r="38" stroke="#fde047" stroke-width="1.5"/>
    <polygon points="0,-48 42,24 -42,24" stroke="#f43f5e" stroke-width="1.2" fill="none"/>
    <polygon points="0,48 42,-24 -42,-24" stroke="#fde047" stroke-width="1.2" fill="none"/>
  </g>
</svg>
