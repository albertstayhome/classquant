<!DOCTYPE html>
<html lang="zh-TW" data-theme="kitty">
<head>
  <meta charset="UTF-8">
  <title>ClassQuant Hub — Interactive Tour Empirical Stress Test Suite</title>
  <link rel="stylesheet" href="../css/custom.css">
  <style>
    body { font-family: sans-serif; padding: 20px; margin: 0; }
    .pass { color: #16a34a; font-weight: bold; }
    .fail { color: #dc2626; font-weight: bold; }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .pointer-events-none { pointer-events: none !important; }
    .pointer-events-auto { pointer-events: auto !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Minimal App DOM required by OnboardingTour & 12 Steps -->
  <header id="global-header" style="height: 60px; position: sticky; top: 0; display: flex; align-items: center; gap: 8px; background: #fff;">
    <button id="header-version-badge"><span>v1.7.9</span> 📢</button>
    <button id="onboarding-guide-btn">🎓 新手教學</button>
    <button id="sound-toggle-btn">🔊</button>
    <button id="theme-toggle-btn">🎀 主題</button>
    <select id="global-class-select">
      <option value="301" selected>3年1班 (數學)</option>
      <option value="302">3年2班 (數學)</option>
      <option value="303">3年3班 (導師班)</option>
    </select>
  </header>

  <nav style="display: flex; gap: 8px; overflow-x: auto; padding: 8px 0;">
    <button data-tab="matrix">課堂點記板</button>
    <button data-tab="roster">👥 班級名單</button>
    <button data-tab="retro">⏰ 課堂事後補記</button>
    <button data-tab="dashboard">統計戰情室</button>
  </nav>

  <main>
    <section id="classroom-matrix-view">
      <div id="seat-card-1" class="student-seat-card" style="width: 120px; height: 80px; margin: 10px; display: inline-block; background: #fdf2f8; border: 1px solid #f472b6;">1號 王小明</div>
      <div id="seat-card-2" class="student-seat-card" style="width: 120px; height: 80px; margin: 10px; display: inline-block; background: #fdf2f8; border: 1px solid #f472b6;">2號 李小美</div>
      <div class="tag-page-slide" style="margin: 10px 0;">
        <button id="first-quick-tag-btn" style="padding: 10px;">主動解出難題 (+3)</button>
      </div>
      <div class="glass-card" style="margin: 10px 0;">
        <button id="custom-tag-open-btn">⚙️ 自訂標籤</button>
      </div>
    </section>

    <section id="roster-manager-view" class="hidden">
      <button id="roster-paste-btn" style="padding: 10px; margin: 5px;">📋 1秒批次貼上名單</button>
      <div class="grid" style="margin: 10px 0;">
        <div id="roster-student-card-1" style="padding: 10px;">
          <input id="roster-student-name-input-1" value="王小明" style="padding: 6px; border: 1px solid #cbd5e1;" />
        </div>
      </div>
    </section>

    <section id="retro-log-view" class="hidden">
      <button id="retro-odd-btn" style="padding: 10px; margin: 5px;">單號(男)</button>
      <button id="retro-submit-btn" style="padding: 10px; margin: 5px;">批次提交</button>
    </section>

    <section id="dashboard-view" class="hidden">
      <div class="glass-card" style="width: 300px; height: 200px; padding: 20px; background: #f8fafc; border: 1px solid #e2e8f0;">四象限圖表</div>
    </section>
  </main>

  <!-- Global Modal Mock for Auto-Pilot Demo -->
  <div id="batch-roster-modal" class="hidden">
    <textarea id="batch-roster-textarea"></textarea>
    <button id="batch-roster-submit-btn">確定匯入</button>
  </div>

  <!-- Permanent Static Onboarding Tour Container (Zero Dynamic Overhead) -->
  <div id="tour-overlay-container" class="fixed inset-0 pointer-events-none hidden" style="z-index: 99999;">
    <!-- Industry Standard SVG Mask Layer (GPU Composited) -->
    <svg id="tour-svg-overlay" class="absolute inset-0 w-full h-full pointer-events-none tour-gpu-layer" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="tour-glow-filter" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.9" />
          <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fb7185" flood-opacity="0.65" />
        </filter>
        <linearGradient id="tour-glow-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f43f5e" />
          <stop offset="50%" stop-color="#fb7185" />
          <stop offset="100%" stop-color="#f43f5e" />
        </linearGradient>
      </defs>
      <!-- Dark Backdrop Mask with Rounded Cutout -->
      <path id="tour-overlay-path" d="" fill="rgba(15, 23, 42, 0.78)" fill-rule="evenodd" style="pointer-events: auto;"></path>
      <!-- Outer Radar Pulse Halo -->
      <rect id="tour-spotlight-halo" x="0" y="0" width="0" height="0" rx="0" ry="0" fill="none" stroke="#fb7185" stroke-width="2" class="tour-pulse-halo pointer-events-none" style="pointer-events: none;"></rect>
      <!-- Synchronized Glowing Outline Accent -->
      <rect id="tour-spotlight-glow" x="0" y="0" width="0" height="0" rx="14" ry="14" fill="none" stroke="url(#tour-glow-stroke)" stroke-width="3" filter="url(#tour-glow-filter)" class="tour-spotlight-pulse pointer-events-none" style="pointer-events: none;"></rect>
    </svg>

    <!-- Calibrated Vector SVG Ghost Cursor Layer -->
    <div id="tour-ghost-cursor" class="fixed pointer-events-none will-change-transform opacity-0 hidden" style="top: 0; left: 0; transform: translate3d(0, 0, 0); transition: opacity 0.2s ease-out; z-index: 100002;">
      <div id="tour-ghost-cursor-body" class="relative pointer-events-none flex items-center justify-center" style="width: 40px; height: 42px; transform-origin: 14px 2.5px;">
        <svg id="tour-ghost-svg" width="40" height="42" viewBox="0 0 40 42" fill="none" xmlns="http://www.w3.org/2000/svg" class="filter drop-shadow-[0_4px_12px_rgba(244,63,94,0.45)]">
          <defs>
            <linearGradient id="ghost-hand-skin" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="60%" stop-color="#fff5f5" />
              <stop offset="100%" stop-color="#ffe4e6" />
            </linearGradient>
          </defs>
          <g>
            <path d="M10.5 16.5V4.5C10.5 2.57 12.07 1 14 1C15.93 1 17.5 2.57 17.5 4.5V14.25M17.5 14.25V7.5C17.5 5.84 18.84 4.5 20.5 4.5C22.16 4.5 23.5 5.84 23.5 7.5V14.25M23.5 14.25V9.75C23.5 8.09 24.84 6.75 26.5 6.75C28.16 6.75 29.5 8.09 29.5 9.75V15.75M29.5 15.75V12C29.5 10.34 30.84 9 32.5 9C34.16 9 35.5 10.34 35.5 12V22.5C35.5 29.13 30.13 34.5 23.5 34.5H18.25C14.11 34.5 10.28 32.35 8.1 28.84L4.8 23.53C3.65 21.68 4.22 19.26 6.07 18.11C7.92 16.96 10.34 17.53 11.49 19.38L13.5 22.5" 
              fill="url(#ghost-hand-skin)" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="14" cy="2.5" r="2.5" fill="#f43f5e" />
          </g>
        </svg>
        <div id="tour-ghost-ripple" class="hidden"></div>
      </div>
    </div>

    <!-- Static 4-Way Directional Pointer -->
    <div id="tour-pointer-container" class="fixed pointer-events-none hidden will-change-transform tour-gpu-layer" style="top: 0; left: 0; transform: translate3d(0, 0, 0); z-index: 100000;">
      <div id="tour-pointer-inner" class="flex flex-col items-center justify-center pointer-events-none">
        <div id="tour-arrow-up" class="tour-arrow-icon text-3xl filter drop-shadow-[0_4px_12px_rgba(244,63,94,0.95)] hidden" style="display: none;">👆</div>
        <div id="tour-pointer-badge" class="bg-gradient-to-r from-pink-600 to-rose-600 text-white font-black text-[11px] px-3.5 py-1 rounded-full shadow-2xl border-1.5 border-white whitespace-nowrap flex items-center gap-1">
          <span id="tour-arrow-left" class="tour-arrow-lateral hidden text-sm" style="display: none;">👈</span>
          <span id="tour-pointer-text">請點擊此處</span>
          <span id="tour-arrow-right" class="tour-arrow-lateral hidden text-sm" style="display: none;">👉</span>
        </div>
        <div id="tour-arrow-down" class="tour-arrow-icon text-3xl filter drop-shadow-[0_4px_12px_rgba(244,63,94,0.95)] hidden" style="display: none;">👇</div>
      </div>
    </div>

    <!-- Viewport-Safe Popover Card -->
    <div id="tour-popover" class="fixed left-3 right-3 sm:left-1/2 sm:-translate-x-1/2 sm:w-[380px] bg-white rounded-3xl p-4 shadow-2xl border-2 border-pink-300 pointer-events-auto transition-all duration-300" style="z-index: 100001; bottom: 14px; top: auto;">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-pink-100">
        <div class="flex items-center space-x-2">
          <span class="kitty-bow !w-3.5 !h-3.5"></span>
          <span id="tour-step-badge" class="text-[11px] font-black px-2.5 py-0.5 rounded-full bg-pink-100 text-pink-700">步驟 1 / 12</span>
        </div>
        <button onclick="onboardingTour.endTour()" class="text-xs font-bold text-slate-400 hover:text-pink-600 transition cursor-pointer" title="結束教學">
          ✕ 結束
        </button>
      </div>
      <h4 id="tour-title" class="text-sm sm:text-base font-black text-slate-900 mb-1.5 flex items-center gap-1.5">1. 班級切換樞紐 (點擊展開)</h4>
      <div id="tour-content" class="text-xs text-slate-600 mb-3 leading-relaxed">這裡是你管理班級的核心！<strong>請點擊下拉選單</strong>，看看裡面為各班獨立保存的分數與名單。</div>
      <div id="tour-action-container" class="flex items-center justify-end pt-1">
        <div class="flex items-center gap-2 w-full justify-between pt-1">
          <div class="px-2.5 py-1 rounded-xl bg-pink-50 text-pink-700 text-[11px] font-bold border border-pink-200 truncate">
            👆 點發光處或直接點右側 ➔
          </div>
          <button onclick="onboardingTour.nextStep()" class="px-4 py-2 rounded-2xl font-black text-white bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-xs sm:text-sm shadow-lg border-2 border-white transition flex items-center gap-1 active:scale-95 cursor-pointer shrink-0 animate-bounce ring-2 ring-pink-200">
            <span>下一步 ➔</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="test-output" style="margin-top: 30px; border-top: 2px solid #ccc; padding-top: 20px;">
    <h2>Stress Test Execution Log</h2>
    <div id="status">Executing stress tests...</div>
    <pre id="summary-json" style="background: #f1f5f9; padding: 15px; border-radius: 8px; font-family: monospace;"></pre>
  </div>

  <!-- Mock App State -->
  <script>
    window.appState = {
      activeTab: 'matrix',
      isSoundEnabled: () => true,
      playPop: () => {},
      playChime: () => {},
      showToast: (msg) => {},
      closeModal: () => {},
      toggleHeader: () => {},
      switchTab: (tab) => {
        window.appState.activeTab = tab;
        document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
        if (tab === 'matrix') document.getElementById('classroom-matrix-view')?.classList.remove('hidden');
        if (tab === 'roster') document.getElementById('roster-manager-view')?.classList.remove('hidden');
        if (tab === 'retro') document.getElementById('retro-log-view')?.classList.remove('hidden');
        if (tab === 'dashboard') document.getElementById('dashboard-view')?.classList.remove('hidden');
      },
      handleManualClassChange: (val) => {}
    };
  </script>

  <!-- Load Tour Engine -->
  <script src="../js/onboardingTour.js"></script>

  <!-- Load Stress Test Runner -->
  <script src="stress_tour_browser_runner.js"></script>
</body>
</html>
