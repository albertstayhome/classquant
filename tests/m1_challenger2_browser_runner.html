<head>
  <meta charset="UTF-8">
  <title>ClassQuant Hub - M1 Challenger 2 Browser Empirical Runner</title>
  <style>
/* Base Tailwind & Custom Color Rules for ClassQuant Hub */
@layer utilities {
  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
}

/* --- Strict 3-Tier Color Rules --- */
/* Positive (+) Score: Fresh Mint Green */
.color-rule-pos {
  background-color: #ecfdf5 !important;
  border-color: #a7f3d0 !important;
  color: #065f46 !important;
}
.color-rule-pos:hover {
  background-color: #d1fae5 !important;
  border-color: #6ee7b7 !important;
}
.color-rule-pos-badge {
  background-color: #d1fae5 !important;
  color: #047857 !important;
  border-color: #a7f3d0 !important;
}

/* Negative (-) Score: Soft Rose Red */
.color-rule-neg {
  background-color: #fff1f2 !important;
  border-color: #fecdd3 !important;
  color: #9f1239 !important;
}
.color-rule-neg:hover {
  background-color: #ffe4e6 !important;
  border-color: #fda4af !important;
}
.color-rule-neg-badge {
  background-color: #ffe4e6 !important;
  color: #be123c !important;
  border-color: #fecdd3 !important;
}

/* Neutral (=0) Score: Slate Gray */
.color-rule-zero {
  background-color: #f8fafc !important;
  border-color: #e2e8f0 !important;
  color: #334155 !important;
}
.color-rule-zero:hover {
  background-color: #f1f5f9 !important;
  border-color: #cbd5e1 !important;
}
.color-rule-zero-badge {
  background-color: #f1f5f9 !important;
  color: #475569 !important;
  border-color: #e2e8f0 !important;
}

/* Collapsible Header Transition */
#global-header {
  transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, padding 0.3s ease, margin 0.3s ease;
  max-height: 240px;
  overflow: visible;
}

#global-header.header-collapsed {
  max-height: 0 !important;
  opacity: 0 !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  margin-top: 0 !important;
  margin-bottom: 0 !important;
  pointer-events: none;
  border-bottom-width: 0 !important;
}

/* Tag Pager Carousel (Strict Single-Page Scroll Snap) */
.tag-pager-container {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  overscroll-behavior-x: contain;
  touch-action: pan-x;
}

.tag-page-slide {
  flex: 0 0 100%;
  width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always !important; /* CRITICAL: Prevents skipping past page 2 directly to 3! */
}

/* Live Clock Indicator */
.live-indicator {
  animation: pulse-live 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

@keyframes pulse-live {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.15); }
}

/* --- Delightful Micro-Animations --- */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.animate-fade-in-up {
  animation: fadeInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes popIn {
  0% { transform: scale(0.92); }
  50% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

.student-seat-card,
.seat-card,
#seat-grid-container .student-seat-card,
.quick-tag-button,
.quick-tag-btn,
.tag-btn,
.action-btn,
#matrix-grid .seat-card,
.point-bubble {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.student-seat-card {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}

.student-seat-card:active {
  transform: scale(0.95);
}

.student-seat-card.selected {
  animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 0 3px #f43f5e, 0 4px 12px rgba(244, 63, 94, 0.25) !important;
}

.quick-tag-button,
.quick-tag-btn,
.tag-btn {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

@keyframes kittyBowWiggle {
  0%, 100% { transform: rotate(0deg) scale(1); }
  25% { rotate: -8deg; scale: 1.08; }
  75% { rotate: 8deg; scale: 1.08; }
}

.kitty-bow:hover, .kitty-cat-avatar:hover {
  animation: kittyBowWiggle 0.5s ease-in-out;
}

/* Enhanced Burst Particle Stamp Effect */
@keyframes burstParticle {
  0% { opacity: 0; transform: translate(-50%, -20%) scale(0.5); }
  35% { opacity: 1; transform: translate(-50%, -60%) scale(1.35); filter: drop-shadow(0 4px 8px rgba(244, 63, 94, 0.4)); }
  70% { opacity: 0.9; transform: translate(-50%, -85%) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -120%) scale(0.9); }
}

.point-bubble {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 1.5rem;
  font-weight: 900;
  pointer-events: none;
  z-index: 50;
  animation: burstParticle 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

/* --- Indestructible 9999px Box-Shadow Dark Spotlight Engine --- */
#tour-spotlight-box {
  position: fixed;
  box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.85);
  border: 3.5px solid #f43f5e;
  border-radius: 18px;
  z-index: 9995;
  pointer-events: none;
  transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  animation: spotlightGlowPulse 1.6s ease-in-out infinite;
}

@keyframes spotlightGlowPulse {
  0%, 100% { 
    box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.85), 0 0 25px rgba(244, 63, 94, 0.95); 
  }
  50% { 
    box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.85), 0 0 45px rgba(244, 63, 94, 1), 0 0 12px #ffffff; 
  }
}

/* Touchmove Scroll Lock during Onboarding Tour */
html.tour-locked, body.tour-locked {
  overflow: hidden !important;
  touch-action: none !important;
  overscroll-behavior: none !important;
}

/* Directional Bouncing Hand Pointer */
@keyframes bouncePointingUp {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.15); }
}

@keyframes bouncePointingDown {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(10px) scale(1.15); }
}

.tour-pointer-up {
  animation: bouncePointingUp 1s ease-in-out infinite;
}

.tour-pointer-down {
  animation: bouncePointingDown 1s ease-in-out infinite;
}

/* Hide scrollbar for clean UI */
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* Dark Theme Overrides */
html.dark body {
  background-color: #0f172a;
  color: #f8fafc;
}
html.dark .glass-card {
  background: rgba(30, 41, 59, 0.9);
  border-color: rgba(51, 65, 85, 0.8);
  color: #f8fafc;
}
html.dark .student-seat-card.selected,
html.dark .compact-seat-tile.selected {
  border-color: #f43f5e !important;
  background-color: rgba(244, 63, 94, 0.2) !important;
  box-shadow: 0 0 0 3px #f43f5e !important;
}

/* --- Permanent Onboarding Tour Overlay Styles (Guaranteed Top Z-Index & GPU Accelerated) --- */
#tour-overlay-container {
  position: fixed !important;
  inset: 0 !important;
  pointer-events: none !important;
  z-index: 99999 !important;
}
#tour-overlay-path {
  pointer-events: auto !important;
}
#tour-popover {
  position: fixed !important;
  z-index: 100001 !important;
  pointer-events: auto !important;
  max-width: min(94vw, 420px) !important;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45) !important;
}
#tour-pointer-container {
  position: fixed !important;
  z-index: 100000 !important;
  pointer-events: none !important;
}
#tour-ghost-cursor {
  position: fixed !important;
  z-index: 100002 !important;
  pointer-events: none !important;
}
.tour-gpu-layer {
  will-change: transform;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
}
@keyframes spotlightGlowPulse {
  0%, 100% {
    filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.85)) drop-shadow(0 0 14px rgba(251, 113, 133, 0.5));
    stroke-opacity: 0.9;
  }
  50% {
    filter: drop-shadow(0 0 12px rgba(244, 63, 94, 1)) drop-shadow(0 0 24px rgba(251, 113, 133, 0.8)) drop-shadow(0 0 3px #ffffff);
    stroke-opacity: 1;
  }
}
@keyframes tourHaloPulse {
  0% { opacity: 0.8; stroke-width: 1.5px; stroke: #f43f5e; }
  50% { opacity: 0.3; stroke-width: 5px; stroke: #fb7185; }
  100% { opacity: 0; stroke-width: 8px; stroke: #fda4af; }
}
.tour-spotlight-pulse {
  animation: spotlightGlowPulse 1.8s ease-in-out infinite;
  vector-effect: non-scaling-stroke;
}
.tour-pulse-halo {
  animation: tourHaloPulse 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  vector-effect: non-scaling-stroke;
}
.tour-arrow-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease-out;
}
.tour-arrow-icon.hidden,
.tour-arrow-lateral.hidden,
#tour-pointer-container .hidden,
#tour-ghost-cursor.hidden {
  display: none !important;
}
.tour-bounce-up {
  animation: pointerBounceUp 1s ease-in-out infinite;
}
.tour-bounce-down {
  animation: pointerBounceDown 1s ease-in-out infinite;
}
.tour-bounce-left {
  animation: pointerBounceLeft 1s ease-in-out infinite;
}
.tour-bounce-right {
  animation: pointerBounceRight 1s ease-in-out infinite;
}
@keyframes pointerBounceUp {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes pointerBounceDown {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(6px); }
}
@keyframes pointerBounceLeft {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-6px); }
}
@keyframes pointerBounceRight {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(6px); }
}
.ghost-cursor-click {
  animation: ghostClick 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes ghostClick {
  0% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(244,63,94,0.45)); }
  45% { transform: scale(0.84) translateY(3px); filter: drop-shadow(0 1px 4px rgba(244,63,94,0.7)); }
  100% { transform: scale(1); filter: drop-shadow(0 4px 12px rgba(244,63,94,0.45)); }
}
.tour-simulated-active {
  transform: scale(0.95) !important;
  filter: brightness(0.92) drop-shadow(0 0 8px rgba(244, 63, 94, 0.6)) !important;
  transition: transform 0.15s ease-out, filter 0.15s ease-out !important;
}

// --- store.js ---
/**

 */

const STORAGE_KEY = 'class_point_quant_hub_data_v1';

// Default Tag Categories and Definitions

  { id: 'disc_late', name: '上課/晨讀遲到', category: 'discipline', delta: -2, severity: 'warning', icon: 'clock' },
  { id: 'disc_sleep', name: '課堂睡覺/發呆', category: 'discipline', delta: -2, severity: 'warning', icon: 'moon' },
  { id: 'disc_distracted', name: '分心玩文具/雜物', category: 'discipline', delta: -1, severity: 'warning', icon: 'eye-off' },
  { id: 'disc_handbook_missing', name: '未交聯絡簿/簽名', category: 'discipline', delta: -1, severity: 'warning', icon: 'clipboard' },
  { id: 'disc_clean_fail', name: '掃除不認真/未到', category: 'discipline', delta: -2, severity: 'warning', icon: 'trash-2' },
  { id: 'disc_officer_good', name: '幹部/小老師盡責', category: 'discipline', delta: 2, severity: 'positive', icon: 'award' },
  { id: 'disc_reading_good', name: '晨讀自習專注', category: 'discipline', delta: 1, severity: 'positive', icon: 'check-circle' },

  // 人際與衝突 (Conflict & Social)
  { id: 'soc_help', name: '主動指導同學/助人', category: 'social', delta: 2, severity: 'positive', icon: 'heart' },
  { id: 'soc_verbal_fight', name: '同儕言語吵架口角', category: 'conflict', delta: -3, severity: 'danger', icon: 'message-square' },
  { id: 'soc_phys_fight', name: '肢體衝突/推擠打架', category: 'conflict', delta: -5, severity: 'critical', icon: 'shield-alert' },
  { id: 'soc_property_damage', name: '毀損公物/他人私物', category: 'conflict', delta: -5, severity: 'critical', icon: 'alert-octagon' },

  // 測驗與評量 (Assessment)
  { id: 'exam_top', name: '小考滿分/全班最高', category: 'assessment', delta: 3, severity: 'positive', icon: 'star' },
  { id: 'exam_progress', name: '小考顯著進步(+10分以上)', category: 'assessment', delta: 2, severity: 'positive', icon: 'trending-up' },
  { id: 'exam_fail_no_correct', name: '小考不及格且未訂正', category: 'assessment', delta: -2, severity: 'danger', icon: 'trending-down' }
];

// Time Periods Configuration (Standard Junior High School Schedule)
const DEFAULT_TIMETABLE_PERIODS = [
  { period: 0, name: '早自習/晨讀', start: '07:50', end: '08:25' },
  { period: 1, name: '第 1 節', start: '08:30', end: '09:15' },
  { period: 2, name: '第 2 節', start: '09:25', end: '10:10' },
  { period: 3, name: '第 3 節', start: '10:20', end: '11:05' },
  { period: 4, name: '第 4 節', start: '11:15', end: '12:00' },
  { period: 'lunch', name: '午餐/午休', start: '12:00', end: '13:10' },
  { period: 5, name: '第 5 節', start: '13:20', end: '14:05' },
  { period: 6, name: '第 6 節', start: '14:15', end: '15:00' },
  { period: 7, name: '第 7 節', start: '15:10', end: '15:55' },
  { period: 'clean', name: '整潔活動', start: '16:00', end: '16:20' },
  { period: 8, name: '第 8 節(輔導)', start: '16:25', end: '17:10' }
];

// Teacher Weekly Schedule (Mon-Fri)
const DEFAULT_WEEKLY_SCHEDULE = {
  1: { 0: '801', 1: '801', 3: '803', 4: '805', 7: '801' },
  2: { 0: '801', 2: '803', 3: '801', 5: '805', 8: '801' },
  3: { 0: '801', 1: '805', 2: '801', 4: '803' },
  4: { 0: '801', 2: '805', 3: '803', 6: '801', 7: '801' },
  5: { 0: '801', 1: '803', 3: '805', 5: '801', 6: '801' }
};

class Store {
  constructor() {
    this.data = this.loadFromStorage();
    if (!this.data || typeof this.data !== 'object' || !this.data.classes || Object.keys(this.data.classes).length === 0 || !this.data.students) {
      this.initDemoData();
    } else {
      // Ensure all fields are fully populated and resilient
      if (!this.data.classes) this.data.classes = {};
      if (!this.data.students) this.data.students = {};
      if (!this.data.assessments) this.data.assessments = {};
      if (!this.data.events) this.data.events = [];
      if (!this.data.retroLogs) this.data.retroLogs = [];
      if (!this.data.tags || this.data.tags.length === 0) this.data.tags = DEFAULT_TAGS;
      if (!this.data.timetablePeriods) this.data.timetablePeriods = DEFAULT_TIMETABLE_PERIODS;
      if (!this.data.weeklySchedule) this.data.weeklySchedule = DEFAULT_WEEKLY_SCHEDULE;
      if (!this.data.settings) this.data.settings = {};
      if (!this.data.settings.theme) this.data.settings.theme = 'kitty';

      // Self-healing: validate every class has a student array
      const studentNames = [
        '陳冠宇', '林子涵', '黃柏翔', '張雅晴', '李承翰', '王品妍', '吳廷軒', '蔡詠晴', '許志豪', '鄭羽彤',
        '郭俊廷', '謝欣潔', '曾郁翔', '洪若涵', '邱冠宏', '賴思妤', '周聖文', '葉佩珊', '莊凱翔', '江詩婷',
        '劉宗憲', '呂佩真', '潘宥安', '顏子淇', '鍾建宇', '蕭曼婷', '彭子豪', '方宣瑜', '蘇家緯', '戴綺芸'
      ];
      Object.values(this.data.classes).forEach(cls => {
        if (!this.data.students[cls.id] || !Array.isArray(this.data.students[cls.id]) || this.data.students[cls.id].length === 0) {
          this.data.students[cls.id] = [];
          for (let seat = 1; seat <= (cls.studentCount || 30); seat++) {
            this.data.students[cls.id].push({
              seatNo: seat,
              name: cls.type === 'homeroom' ? studentNames[seat - 1] || `座號 ${seat}` : `座號 ${seat} (${studentNames[seat - 1]?.[0] || '生'}生)`,
              gender: seat % 2 === 1 ? 'M' : 'F',
              baselineAbility: 60 + Math.floor(Math.random() * 35),
              notes: ''
            });
          }
        }
      });
      this.saveToStorage();
    }
  }

  loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      console.error('Failed to load from storage:', e);
      return null;
    }
  }

  saveToStorage() {
    try {
      this.data.lastModified = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
    } catch (e) {
      console.error('Failed to save to storage:', e);
    }
  }

  save(data = null) {
    if (data) {
      this.data = data;
    }
    this.saveToStorage();
  }

  initDemoData() {
    const classes = {
      '801': {
        id: '801',
        name: '801 班',
        type: 'homeroom', // 導師班 (本班)
        subject: '導師班 / 數學',
        studentCount: 30,
        seatLayout: { rows: 5, cols: 6 }
      },
      '803': {
        id: '803',
        name: '803 班',
        type: 'subject', // 科任班 (任教班)
        subject: '數學',
        studentCount: 30,
        seatLayout: { rows: 5, cols: 6 }
      },
      '805': {
        id: '805',
        name: '805 班',
        type: 'subject', // 科任班 (任教班)
        subject: '數學',
        studentCount: 28,
        seatLayout: { rows: 5, cols: 6 }
      }
    };

    const students = {};
    const studentNames = [
      '陳冠宇', '林子涵', '黃柏翔', '張雅晴', '李承翰', '王品妍', '吳廷軒', '蔡詠晴', '許志豪', '鄭羽彤',
      '郭俊廷', '謝欣潔', '曾郁翔', '洪若涵', '邱冠宏', '賴思妤', '周聖文', '葉佩珊', '莊凱翔', '江詩婷',
      '劉宗憲', '呂佩真', '潘宥安', '顏子淇', '鍾建宇', '蕭曼婷', '彭子豪', '方宣瑜', '蘇家緯', '戴綺芸'
    ];

    Object.values(classes).forEach(cls => {
      students[cls.id] = [];
      for (let seat = 1; seat <= cls.studentCount; seat++) {

// --- timetable.js ---
/**
 * Timetable Engine & Class Auto-Switching System
 * Handles real-time schedule detection, manual overrides, and schedule management.
 */

class TimetableEngine {
  constructor(store) {
    this.store = store;
    this.simulatedTime = null; // null for real time, or { day: 1-5, timeStr: '10:30' }
    this.listeners = [];
    this.startClock();
  }

  onClassChange(callback) {
    this.listeners.push(callback);
  }

  notifyClassChange(classId, context) {
    this.listeners.forEach(cb => cb(classId, context));
  }

  getCurrentTimeInfo() {
    let now = new Date();
    let day = now.getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat
    let hours = String(now.getHours()).padStart(2, '0');
    let minutes = String(now.getMinutes()).padStart(2, '0');
    let timeStr = `${hours}:${minutes}`;

    if (this.simulatedTime) {
      day = this.simulatedTime.day;
      timeStr = this.simulatedTime.timeStr;
    }

    return { day, timeStr, isSimulated: !!this.simulatedTime };
  }

  // Parse HH:MM to total minutes from midnight
  timeToMinutes(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return h * 60 + m;
  }

  detectActiveSlot() {
    const { day, timeStr } = this.getCurrentTimeInfo();
    const periods = this.store.data.timetablePeriods;
    const weeklySchedule = this.store.data.weeklySchedule;
    const currentMins = this.timeToMinutes(timeStr);

    // If Weekend (0 = Sun, 6 = Sat)
    if (day === 0 || day === 6) {
      return {
        status: 'weekend',
        period: null,
        classId: null,
        message: '週末非授課時段',
        nextSlot: null
      };
    }

    const daySchedule = weeklySchedule[day] || {};

    // Check if within any period
    for (let i = 0; i < periods.length; i++) {
      const p = periods[i];
      const startMins = this.timeToMinutes(p.start);
      const endMins = this.timeToMinutes(p.end);

      if (currentMins >= startMins && currentMins <= endMins) {
        const classId = daySchedule[p.period] || null;
        const remaining = endMins - currentMins;
        return {
          status: 'in_session',
          period: p.period,
          periodName: p.name,
          classId: classId,
          start: p.start,
          end: p.end,
          remainingMinutes: remaining,
          message: `正在進行：${p.name} (剩餘 ${remaining} 分鐘)`
        };
      }
    }

    // Check if in break between periods
    for (let i = 0; i < periods.length - 1; i++) {
      const currentEnd = this.timeToMinutes(periods[i].end);
      const nextStart = this.timeToMinutes(periods[i + 1].start);

      if (currentMins > currentEnd && currentMins < nextStart) {
        const nextPeriod = periods[i + 1];
        const nextClassId = daySchedule[nextPeriod.period] || null;
        const prevPeriod = periods[i];
        const prevClassId = daySchedule[prevPeriod.period] || null;
        const remainingToNext = nextStart - currentMins;

        return {
          status: 'in_break',
          period: prevPeriod.period,
          periodName: `課間休息 (上節: ${prevPeriod.name})`,
          classId: prevClassId, // retain previous class for late logging
          nextClassId: nextClassId,
          nextPeriodName: nextPeriod.name,
          remainingMinutes: remainingToNext,
          message: `課間休息中 • 下節：${nextPeriod.name} (${nextClassId ? nextClassId + '班' : '無課'}) 還有 ${remainingToNext} 分鐘`
        };
      }
    }

    // Outside school hours
    return {
      status: 'off_hours',
      period: null,
      classId: null,
      message: '非課堂時段 (備課/自習)',
      nextSlot: null
    };
  }

  getActiveClassId() {
    // 1. Check if user manually forced an override
    if (this.store.data.currentClassOverride) {
      return {
        classId: this.store.data.currentClassOverride,
        isOverride: true,
        slotInfo: this.detectActiveSlot()
      };
    }

    // 2. Check auto detected slot
    const slotInfo = this.detectActiveSlot();
    if (slotInfo.classId) {
      return {
        classId: slotInfo.classId,
        isOverride: false,
        slotInfo: slotInfo
      };
    }

    // 3. Default fallback: first available class (e.g. homeroom)
    const allClasses = Object.keys(this.store.data.classes);
    const homeroom = Object.values(this.store.data.classes).find(c => c.type === 'homeroom');
    const fallbackId = homeroom ? homeroom.id : allClasses[0] || null;

    return {
      classId: fallbackId,
      isOverride: false,
      slotInfo: slotInfo
    };
  }

  setManualOverride(classId) {
    this.store.setManualClassOverride(classId);
    this.notifyClassChange(classId, { isOverride: true });
  }

  clearManualOverride() {
    this.store.clearManualClassOverride();
    const active = this.getActiveClassId();
    this.notifyClassChange(active.classId, { isOverride: false });
  }

  setSimulationTime(day, timeStr) {
    this.simulatedTime = { day, timeStr };
    const active = this.getActiveClassId();
    this.notifyClassChange(active.classId, { isSimulation: true });
  }

  clearSimulation() {
    this.simulatedTime = null;
    const active = this.getActiveClassId();
    this.notifyClassChange(active.classId, { isSimulation: false });
  }

  startClock() {
    // Check every 30 seconds
    setInterval(() => {
      if (this.store.data.settings.autoSwitchTimetable && !this.store.data.currentClassOverride) {
        const active = this.getActiveClassId();
        this.notifyClassChange(active.classId, { isPeriodicCheck: true });
      }
    }, 30000);
  }
}

// --- statistics.js ---
/**
 * Quantitative Educational Statistics Engine
 * Implements EWMA, 2-sigma cliff drop detection, Box Plot quartiles, 4-quadrant clustering,
 * and Multi-Class Comparative Benchmarking for differentiated homework and instructional strategy.
 * Fully null-safe for newly added classes and dynamically modified rosters.
 */

class StatisticsEngine {
  constructor(store) {
    this.store = store;
  }

  // --- Basic Statistical Utilities ---
  mean(arr) {
    if (!arr || arr.length === 0) return 0;
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }

  standardDeviation(arr, isSample = true) {
    if (!arr || arr.length < (isSample ? 2 : 1)) return 0;
    const avg = this.mean(arr);
    const sumSquareDiff = arr.reduce((sum, val) => sum + Math.pow(val - avg, 2), 0);
    const denom = isSample ? arr.length - 1 : arr.length;
    return Math.sqrt(sumSquareDiff / denom);
  }

  quantile(sortedArr, q) {
    if (!sortedArr || sortedArr.length === 0) return 0;
    const pos = (sortedArr.length - 1) * q;
    const base = Math.floor(pos);
    const rest = pos - base;
    if (sortedArr[base + 1] !== undefined) {
      return sortedArr[base] + rest * (sortedArr[base + 1] - sortedArr[base]);
    } else {
      return sortedArr[base];
    }
  }

  getFiveNumberSummary(arr) {
    if (!arr || arr.length === 0) {
      return { min: 0, q1: 0, median: 0, q3: 0, max: 0, iqr: 0, outliers: [] };
    }
    const sorted = [...arr].sort((a, b) => a - b);
    const min = sorted[0];
    const max = sorted[sorted.length - 1];
    const q1 = this.quantile(sorted, 0.25);
    const median = this.quantile(sorted, 0.5);
    const q3 = this.quantile(sorted, 0.75);
    const iqr = q3 - q1;

    const lowerBound = q1 - 1.5 * iqr;
    const upperBound = q3 + 1.5 * iqr;
    const outliers = sorted.filter(x => x < lowerBound || x > upperBound);

    return {
      min: Math.round(min * 10) / 10,
      q1: Math.round(q1 * 10) / 10,
      median: Math.round(median * 10) / 10,
      q3: Math.round(q3 * 10) / 10,
      max: Math.round(max * 10) / 10,
      iqr: Math.round(iqr * 10) / 10,
      outliers
    };
  }

  // --- EWMA (Exponential Weighted Moving Average) ---
  calculateEWMA(values, alpha = 0.35) {
    if (!values || values.length === 0) return [];
    const ewma = [values[0]];
    for (let i = 1; i < values.length; i++) {
      const smoothed = alpha * values[i] + (1 - alpha) * ewma[i - 1];
      ewma.push(Math.round(smoothed * 10) / 10);
    }
    return ewma;
  }

  // --- Linear Regression (Slope for progress velocity) ---
  calculateSlope(yValues) {
    const n = yValues.length;
    if (n < 2) return 0;
    const xValues = Array.from({ length: n }, (_, i) => i + 1);
    const xMean = this.mean(xValues);
    const yMean = this.mean(yValues);

    let numerator = 0;
    let denominator = 0;
    for (let i = 0; i < n; i++) {
      numerator += (xValues[i] - xMean) * (yValues[i] - yMean);
      denominator += Math.pow(xValues[i] - xMean, 2);
    }
    return denominator === 0 ? 0 : Math.round((numerator / denominator) * 100) / 100;
  }

  // --- Student Comprehensive Metrics Profile ---
  getStudentProfile(classId, seatNo) {
    const student = this.store.getStudent(classId, seatNo);
    if (!student) return null;

    const classEvents = this.store.getEvents(classId).filter(e => e.seatNo === parseInt(seatNo, 10));
    const assessments = this.store.getAssessments(classId);

    // 1. Assessment Scores Progression
    const studentScores = [];
    const assessmentList = [];
    assessments.forEach(asm => {
      if (asm.scores && asm.scores[seatNo] !== undefined) {
        studentScores.push(Number(asm.scores[seatNo]));
        assessmentList.push(asm);
      }
    });

    const scoreMean = studentScores.length > 0 ? this.mean(studentScores) : 70;
    const scoreStd = this.standardDeviation(studentScores);
    const ewmaScores = this.calculateEWMA(studentScores);
    const scoreSlope = this.calculateSlope(studentScores);

    // 2. Behavioral & Engagement Metrics
    let academicBonus = 0;
    let disciplineInfractions = 0;
    let conflictIncidents = 0;
    let socialContributions = 0;
    let recentNegativeCount = 0;

    const now = new Date();
    const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    classEvents.forEach(evt => {
      const delta = evt.delta || 0;
      if (evt.category === 'academic') {
        academicBonus += delta;
      } else if (evt.category === 'discipline') {
        disciplineInfractions += delta;
      } else if (evt.category === 'conflict') {
        conflictIncidents += delta;
      } else if (evt.category === 'social') {
        socialContributions += delta;
      }

      if (delta < 0 && evt.date) {
        const evtDate = new Date(evt.date);
        if (evtDate >= oneWeekAgo) {
          recentNegativeCount++;
        }
      }
    });

    const netPoints = academicBonus + disciplineInfractions + conflictIncidents + socialContributions;

    // 3. Cliff Drop & Alert Detection (2-sigma drop or severe slope)
    let isCliffDrop = false;
    let cliffDropReason = '';

    if (studentScores.length >= 3) {
      const latestScore = studentScores[studentScores.length - 1];
      const previousScores = studentScores.slice(0, -1);
      const prevMean = this.mean(previousScores);
      const prevStd = this.standardDeviation(previousScores);

      if (prevStd > 0 && latestScore < prevMean - 1.8 * prevStd) {
        isCliffDrop = true;
        cliffDropReason = `最新評量 (${latestScore}分) 發生斷崖式下滑 (低於均值 ${Math.round((prevMean - latestScore)*10)/10} 分)`;
      } else if (scoreSlope < -2.5) {
        isCliffDrop = true;
        cliffDropReason = `近期連續小考下滑斜率顯著 (斜率: ${scoreSlope})`;
      }
    }

    if (recentNegativeCount >= 3) {
      isCliffDrop = true;
      cliffDropReason = (cliffDropReason ? cliffDropReason + ' • ' : '') + `近一週連續累積 ${recentNegativeCount} 次常規違規`;
    }

    // 4. Five-Dimensional Educational Quant Index (0-100 normalized)
    const mathAbility = Math.min(100, Math.max(0, Math.round(scoreMean + academicBonus * 0.5)));
    const motivation = Math.min(100, Math.max(0, Math.round(60 + scoreSlope * 5 + academicBonus * 2)));
    const accountability = Math.min(100, Math.max(0, Math.round(75 + disciplineInfractions * 2.5)));
    const discipline = Math.min(100, Math.max(0, Math.round(80 + disciplineInfractions * 3 + conflictIncidents * 4)));
    const socialEmotional = Math.min(100, Math.max(0, Math.round(70 + socialContributions * 3 + conflictIncidents * 5)));

    const radar = {
      mathAbility,
      motivation,
      accountability,
      discipline,
      socialEmotional
    };

    return {
      student,
      rawScores: studentScores,
      assessmentList,
      scoreMean: Math.round(scoreMean * 10) / 10,
      scoreStd: Math.round(scoreStd * 10) / 10,
      ewmaScores,
      scoreSlope,
      pointsBreakdown: {
        academic: academicBonus,
        discipline: disciplineInfractions,
        conflict: conflictIncidents,
        social: socialContributions,
        net: netPoints
      },
      isCliffDrop,
      cliffDropReason,
      radar
    };
  }

  // --- Class-Level Aggregate Analysis ---
  getClassOverview(classId) {
    const students = this.store.getStudents(classId) || [];
    const assessments = this.store.getAssessments(classId) || [];
    const events = this.store.getEvents(classId) || [];

    const studentProfiles = students.map(s => this.getStudentProfile(classId, s.seatNo)).filter(Boolean);

    // Latest Assessment Summary & Box Plot
    const latestAsm = assessments.length > 0 ? assessments[assessments.length - 1] : null;
    let latestAsmScores = [];
    let latestBoxPlot = null;
    if (latestAsm && latestAsm.scores) {
      latestAsmScores = Object.values(latestAsm.scores).map(Number);
      latestBoxPlot = this.getFiveNumberSummary(latestAsmScores);
    }

    // Net Points Distribution
    const netPointsArr = studentProfiles.map(p => p.pointsBreakdown.net);
    const pointsBoxPlot = this.getFiveNumberSummary(netPointsArr);

    // Differentiated Instruction 4-Quadrant Clustering
    const classAvgScore = studentProfiles.length > 0 ? this.mean(studentProfiles.map(p => p.scoreMean)) : 70;
    const classAvgEngagement = studentProfiles.length > 0 ? this.mean(studentProfiles.map(p => p.pointsBreakdown.net)) : 0;

    const clusters = {
      topTier: [],      // High Score, High Engagement (拔尖進階組)
      underachiever: [],// High Score, Low Engagement (潛力未發揮)
      hardWorker: [],   // Low Score, High Engagement (努力待補救組)
      highRisk: []      // Low Score, Low Engagement (雙低關懷組)
    };

    studentProfiles.forEach(p => {
      const isHighAbility = p.scoreMean >= (classAvgScore || 70);
      const isHighEngagement = p.pointsBreakdown.net >= (classAvgEngagement || 0);

      const item = {
        seatNo: p.student.seatNo,
        name: p.student.name,
        scoreMean: p.scoreMean,
        netPoints: p.pointsBreakdown.net,
        isCliffDrop: p.isCliffDrop,
        cliffReason: p.cliffDropReason
      };

      if (isHighAbility && isHighEngagement) {
        clusters.topTier.push(item);
      } else if (isHighAbility && !isHighEngagement) {
        clusters.underachiever.push(item);
      } else if (!isHighAbility && isHighEngagement) {
        clusters.hardWorker.push(item);
      } else {
        clusters.highRisk.push(item);
      }
    });

    const alertStudents = studentProfiles.filter(p => p.isCliffDrop);

    // Period Infraction Heatmap Analysis
    const periodInfractions = {};
    events.forEach(e => {
      if (e.delta < 0) {
        const p = e.period !== undefined ? `節次 ${e.period}` : '其他';
        periodInfractions[p] = (periodInfractions[p] || 0) + 1;
      }
    });

    return {
      classId,
      totalStudents: students.length,
      studentProfiles,
      latestAssessment: latestAsm,
      latestBoxPlot,
      pointsBoxPlot,
      classAvgScore: Math.round(classAvgScore * 10) / 10,
      classAvgEngagement: Math.round(classAvgEngagement * 10) / 10,
      clusters,
      alertStudents,
      periodInfractions
    };
  }

  // --- Multi-Class Cross-Benchmark & Strategy Engine ---
  getMultiClassComparison() {
    const classes = this.store.getClasses() || {};
    const classOverviews = {};
    const classList = Object.values(classes);

    classList.forEach(cls => {
      classOverviews[cls.id] = this.getClassOverview(cls.id);
    });

    // Compute Homework & Teaching Strategy Advisory for each class
    const strategies = classList.map(cls => {
      const ov = classOverviews[cls.id];
      const avgScore = ov ? ov.classAvgScore : 70;
      const avgEng = ov ? ov.classAvgEngagement : 0;
      const topCount = ov?.clusters?.topTier?.length || 0;
      const riskCount = (ov?.clusters?.highRisk?.length || 0) + (ov?.clusters?.hardWorker?.length || 0);

      let hwLevel = '';
      let hwDetail = '';
      let teachingStyle = '';

      if (avgScore >= 80) {
        hwLevel = '🌟 拔尖拓展型';
        hwDetail = '核心基礎題 3 題 + 思考探究競賽題 2 題（著重代數多向證明）';
        teachingStyle = '加快單元概念解說節奏，多安排學生上台發表與組間競賽搶答';
      } else if (avgScore >= 70 && avgEng >= 0) {
        hwLevel = '📘 穩健進階型';
        hwDetail = '核心觀念題 4 題 + 題型變化題 2 題（著重題型辨析與步驟規範）';
        teachingStyle = '強化典型例題板書拆解，隨堂抽查同儕筆記與概念理解程度';
      } else if (avgScore < 70 && avgEng >= 0) {
        hwLevel = '🌱 核心打底型';
        hwDetail = '基礎定義題 5 題 + 錯題確實訂正（每題附簡易步驟提示）';
        teachingStyle = '降低單堂概念密度，增加課堂隨堂演練時間與即時小組互助打底';
      } else {
        hwLevel = '🛡️ 補救激勵型';
        hwDetail = '降階基礎核心 3~4 題（限時小步完成，並給予課堂加點肯定）';
        teachingStyle = '課堂以短節奏提問提神，加強巡視與口頭讚美，避免挫折感堆積';
      }

      return {
        classId: cls.id,
        className: cls.name,
        type: cls.type,
        studentCount: cls.studentCount || 0,
        avgScore,
        avgEng,
        topCount,
        riskCount,
        hwLevel,
        hwDetail,
        teachingStyle
      };
    });

    return {
      classList,
      classOverviews,
      strategies
    };
  }
}

                    <button id="${btnId}" onclick="matrixView.applyTagToSelected('${currentClassId}', '${tag.id}')"

                      <div class="flex flex-col pr-1 overflow-hidden">
                        <span class="text-xs sm:text-base font-black truncate text-slate-900 leading-tight">${tag.name}</span>
                        <span class="text-[10px] text-slate-500 font-bold mt-0.5 truncate">${tag.category === 'academic' ? '數學學業' : tag.category === 'discipline' ? '生活常規' : tag.category === 'conflict' ? '同儕衝突' : '日常記事'}</span>
                      </div>
                      <span class="text-xs sm:text-sm font-black px-3 py-1 rounded-xl border shrink-0 ${badgeClass}">
                        ${tag.delta > 0 ? '+' : ''}${tag.delta}
                      </span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>

        <!-- Bottom Swipe Indicator Hint -->
        ${tagPages.length > 1 ? `
          <div class="text-center text-[10px] text-slate-400 mt-2 font-bold flex items-center justify-center gap-1">
            <span>第 ${this.currentTagPage + 1} / ${tagPages.length} 頁（向左滑 或 點按 ◀ ▶ 翻頁）</span>
          </div>
        ` : ''}
      </div>
    `;

    if (window.lucide) {
      window.lucide.createIcons();
    }
  } catch (err) {
    console.error('[ClassroomMatrix] render error:', err);

      container.innerHTML = `

            點此立即刷新座位表
          </button>

}

  handleTouchStart(e) {
    if (e.touches && e.touches.length > 0) {
      this.touchStartX = e.touches[0].clientX;
    }
  }

  handleTouchEnd(e) {
    if (e.changedTouches && e.changedTouches.length > 0) {
      const touchEndX = e.changedTouches[0].clientX;
      const diffX = this.touchStartX - touchEndX;

      // Swipe Left (Next Page strictly by 1)
      if (diffX > 45) {
        this.nextTagPage();
      }
      // Swipe Right (Prev Page strictly by 1)
      else if (diffX < -45) {
        this.prevTagPage();
      }
    }
  }

  prevTagPage() {
    if (this.currentTagPage > 0) {
      this.scrollToTagPage(this.currentTagPage - 1);
    }
  }

  nextTagPage() {
    if (this.currentTagPage < (this.maxTagPages || 1) - 1) {
      this.scrollToTagPage(this.currentTagPage + 1);
    }
  }

  scrollToTagPage(pageIdx) {
    this.currentTagPage = pageIdx;
    const box = document.getElementById('tag-pager-scroll-box');
    if (box) {
      box.scrollTo({
        left: box.clientWidth * pageIdx,
        behavior: 'smooth'
      });
    }
    this.updateTagDots(pageIdx);
  }

  handleTagPagerScroll(el) {
    const width = el.clientWidth;
    if (width > 0) {
      const page = Math.round(el.scrollLeft / width);
      if (page !== this.currentTagPage) {
        this.currentTagPage = page;
        this.updateTagDots(page);
      }
    }
  }

  updateTagDots(activeIdx) {
    const dotsContainer = document.getElementById('tag-page-dots');
    if (!dotsContainer) return;
    const dots = dotsContainer.querySelectorAll('button');
    dots.forEach((dot, idx) => {
      if (idx === activeIdx) {
        dot.className = 'w-5 h-2.5 rounded-full bg-pink-600 transition-all';
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-pink-200 transition-all';
      }
    });
  }

  toggleSeatSelection(seatNo, classId) {
    const isSelected = this.selectedSeats.has(seatNo);
    if (isSelected) {
      this.selectedSeats.delete(seatNo);
    } else {
      this.selectedSeats.add(seatNo);
      if (window.appState?.playPop) window.appState.playPop();
      if (navigator.vibrate) {
        try { navigator.vibrate(15); } catch(e) {}
      }
    }

    // Direct O(1) in-place card class update
    const card = document.getElementById(`seat-card-${seatNo}`);
    if (card) {
      card.classList.toggle('selected', !isSelected);
    }

    // Update selection count badge
    const countElem = document.getElementById('selected-count');
    if (countElem) countElem.innerText = this.selectedSeats.size;

    // Update clear button visibility
    const clearBtn = document.getElementById('clear-sel-btn');
    if (clearBtn) {
      if (this.selectedSeats.size > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('inline-block');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('inline-block');
      }
    }
  }

  toggleSeat(seatNo, classId) {
    return this.toggleSeatSelection(seatNo, classId);
  }

  selectAll() {
    const currentClassId = window.appState.currentClassId;
    const students = this.store.getStudents(currentClassId);
    students.forEach(s => this.selectedSeats.add(s.seatNo));
    if (window.appState?.playPop) window.appState.playPop();
    this.updateSelectionUI(currentClassId);
  }

  clearSelection(classId) {
    const targetClassId = classId || window.appState?.currentClassId || '801';
    this.selectedSeats.clear();
    this.updateSelectionUI(targetClassId);
  }

  updateSelectionUI(classId) {
    const students = this.store.getStudents(classId);
    students.forEach(s => {
      const card = document.getElementById(`seat-card-${s.seatNo}`);
      if (card) {
        if (this.selectedSeats.has(s.seatNo)) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      }
    });

    const countElem = document.getElementById('selected-count');
    if (countElem) countElem.innerText = this.selectedSeats.size;

    const clearBtn = document.getElementById('clear-sel-btn');
    if (clearBtn) {
      if (this.selectedSeats.size > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('inline-block');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('inline-block');
      }
    }
  }

  applyTagToSelected(classId, tagId) {
    if (this.selectedSeats.size === 0) {
      window.appState?.showToast('請先點選學生座號（點一下即可）', 'warning');
      return;
    }

    const tag = this.store.getTags().find(t => t.id === tagId);
    if (!tag) return;

    try {
      const activeSlot = this.timetable.detectActiveSlot();
      const period = activeSlot.period !== null ? activeSlot.period : 1;

      let appliedCount = 0;
      const seatsToProcess = Array.from(this.selectedSeats);

      seatsToProcess.forEach(seatNo => {
        this.store.addEvent({
          classId,
          seatNo,
          period,
          tagId: tag.id,
          tagName: tag.name,
          category: tag.category,
          delta: tag.delta,
          severity: tag.severity,
          note: `課堂記點：${tag.name}`
        });

        this.showFloatingBubble(seatNo, tag.delta);
        appliedCount++;

        // In-place score update on card targeting character score span (index 2)
        const card = document.getElementById(`seat-card-${seatNo}`);
        if (card) {
          const profile = this.stats.getStudentProfile(classId, seatNo);
          if (profile) {
            const charPts = profile.pointsBreakdown.discipline + profile.pointsBreakdown.conflict + profile.pointsBreakdown.social;
            const scoreSpans = card.querySelectorAll('div > span');
            if (scoreSpans.length >= 3) {
              const ptsSpan = scoreSpans[2];
              ptsSpan.className = charPts > 0 ? 'text-emerald-700' : charPts < 0 ? 'text-rose-700' : 'text-slate-500';
              ptsSpan.innerText = `${charPts > 0 ? '+' : ''}${charPts}`;
            } else if (scoreSpans.length >= 2) {
              const ptsSpan = scoreSpans[1];
              ptsSpan.className = charPts > 0 ? 'text-emerald-700' : charPts < 0 ? 'text-rose-700' : 'text-slate-500';
              ptsSpan.innerText = `${charPts > 0 ? '+' : ''}${charPts}`;
            }
          }
        }
      });

      // Sound effect
      if (tag.delta > 0 && window.appState?.playChime) {
        window.appState.playChime();
      } else if (tag.delta < 0 && window.appState?.playWarning) {
        window.appState.playWarning();
      }

      window.appState?.showToast(`✨ 已為 ${appliedCount} 位同學記錄「${tag.name} (${tag.delta > 0 ? '+' : ''}${tag.delta})」`, 'success');
    } catch (err) {
      console.error('[ClassroomMatrix] applyTagToSelected error:', err);
    } finally {
      // Auto-clear selection reliably with explicit classId under all execution paths
      this.clearSelection(classId);
    }
  }

  showFloatingBubble(seatNo, delta) {
    const card = document.getElementById(`seat-card-${seatNo}`);
    if (!card) return;

    const bubble = document.createElement('div');
    bubble.className = `point-bubble ${delta > 0 ? 'text-emerald-600' : 'text-rose-600'} kitty-stamp-effect`;
    bubble.style.pointerEvents = 'none';
    bubble.innerText = `${delta > 0 ? '✨ +' : ''}${delta}`;
    card.appendChild(bubble);

    setTimeout(() => {
      bubble.remove();
    }, 800);
  }

  saveRetroLog(e, classId) {
    e.preventDefault();
    const checkboxes = document.querySelectorAll('input[name="retro_seats"]:checked');
    const seats = Array.from(checkboxes).map(cb => parseInt(cb.value, 10));

    if (seats.length === 0) {
      window.appState.showToast('請至少勾選一位學生', 'warning');
      return;
    }

    const date = document.getElementById('retro-date').value;
    const period = document.getElementById('retro-period').value;
    const note = document.getElementById('retro-note').value.trim();
    const tagSelect = document.getElementById('retro-tag');
    const selectedOpt = tagSelect.options[tagSelect.selectedIndex];
    
    const tagName = selectedOpt.getAttribute('data-name');
    const delta = parseInt(selectedOpt.getAttribute('data-delta'), 10) || 0;
    const category = selectedOpt.getAttribute('data-category') || 'discipline';
    const severity = selectedOpt.getAttribute('data-severity') || 'info';

    seats.forEach(seatNo => {
      this.store.addEvent({
        classId,
        seatNo,
        date,
        period,
        tagId: tagSelect.value,
        tagName,
        category,
        delta,
        severity,
        note: note ? `[事後補記] ${note}` : `[事後補記] ${tagName}`
      });
    });

    if (delta > 0 && window.appState?.playChime) {
      window.appState.playChime();
    } else if (delta < 0 && window.appState?.playWarning) {
      window.appState.playWarning();
    }

    window.appState.showToast(`🎉 已成功補記 ${seats.length} 位同學在 ${date} 第 ${period} 節之記錄！`, 'success');
    window.appState.closeModal();
    this.render('classroom-matrix-view', classId);
  }

  runPickerAnimation(classId) {
    const students = this.store.getStudents(classId);
    const box = document.getElementById('picker-result-box');
    const startBtn = document.getElementById('btn-start-pick');
    if (!box || !startBtn) return;

    startBtn.disabled = true;
    startBtn.classList.add('opacity-50', 'cursor-not-allowed');

    let count = 0;
    const maxSteps = 18;
    const interval = setInterval(() => {
      const randIdx = Math.floor(Math.random() * students.length);
      const tempStudent = students[randIdx];
      box.innerHTML = `
        <div class="text-3xl font-black text-pink-600 animate-pulse">${String(tempStudent.seatNo).padStart(2, '0')} 號</div>

        clearInterval(interval);

        const chosenStudent = students[Math.floor(Math.random() * students.length)];

    `;

    modal.classList.remove('hidden');
    if (window.lucide) window.lucide.createIcons();
  }

  saveConflictEvent(e, classId) {
    e.preventDefault();
    const checkboxes = document.querySelectorAll('input[name="involved_seats"]:checked');
    const seats = Array.from(checkboxes).map(cb => parseInt(cb.value, 10));

    if (seats.length === 0) {
      window.appState.showToast('請至少勾選一位學生', 'warning');
      return;
    }

    const type = document.getElementById('conflict-type').value;
    const period = document.getElementById('conflict-period').value;
    const notes = document.getElementById('conflict-notes').value.trim();

    const tag = this.store.getTags().find(t => t.id === type) || {
      id: type,
      name: '重大衝突違紀',
      category: 'conflict',
      delta: -5,
      severity: 'critical'
    };

    seats.forEach(seatNo => {
      this.store.addEvent({
        classId,
        seatNo,
        period,
        tagId: tag.id,
        tagName: tag.name,
        category: 'conflict',
        delta: tag.delta,
        severity: 'critical',
        note: `[重大事件] ${notes} (涉案座號: ${seats.join(', ')})`
      });
      this.showFloatingBubble(seatNo, tag.delta);
    });

    if (window.appState?.playWarning) window.appState.playWarning();

    window.appState.showToast(`已確實記錄座號 ${seats.join(', ')} 重大事件`, 'success');
    window.appState.closeModal();
    this.render('classroom-matrix-view', classId);
  }
}

  switchClass(classId) {
    this.currentClassId = classId;
    this.selectedSeats.clear();

  }

  setDate(date) {
    this.selectedDate = date;
  }

  setPeriod(period) {
    this.selectedPeriod = parseInt(period, 10);
  }

  toggleSeat(seatNo) {
    const isSelected = this.selectedSeats.has(seatNo);
    if (isSelected) {
      this.selectedSeats.delete(seatNo);
    } else {
      this.selectedSeats.add(seatNo);
    }
    if (window.appState?.playPop) window.appState.playPop();

    // In-place element update to prevent scroll jump and DOM reconstruction
    const card = document.getElementById(`retro-student-${seatNo}`);
    if (card) {
      if (!isSelected) {
        card.className = 'cursor-pointer p-2.5 rounded-2xl border transition-all text-center select-none active:scale-95 bg-pink-500 text-white border-pink-600 shadow-md transform scale-[1.02] font-black';
        const subtext = card.querySelector('.font-mono:last-child');
        if (subtext) subtext.className = 'text-[10px] mt-1 font-mono text-pink-100';
      } else {
        card.className = 'cursor-pointer p-2.5 rounded-2xl border transition-all text-center select-none active:scale-95 bg-white hover:bg-pink-50/60 border-pink-200 text-slate-800 font-bold';
        const subtext = card.querySelector('.font-mono:last-child');
        if (subtext) subtext.className = 'text-[10px] mt-1 font-mono text-slate-500';
      }
    }

    const badge = document.getElementById('retro-selected-badge');
    if (badge) {
      badge.innerText = `已選取 ${this.selectedSeats.size} 人`;
    }

    const btnText = document.getElementById('retro-submit-btn-text');
    if (btnText) {
      btnText.innerText = `✨ 立即 1 鍵批次補記 (${this.selectedSeats.size} 位學生)`;
    }
  }

  selectAll() {
    const students = this.store.getStudents(this.currentClassId);
    students.forEach(s => this.selectedSeats.add(s.seatNo));
    if (window.appState?.playPop) window.appState.playPop();
    this.render('retro-log-view');
  }

  selectNone() {
    this.selectedSeats.clear();
    if (window.appState?.playPop) window.appState.playPop();
    this.render('retro-log-view');
  }

  selectOdd() {
    this.selectedSeats.clear();
    const students = this.store.getStudents(this.currentClassId);
    students.filter(s => s.seatNo % 2 !== 0).forEach(s => this.selectedSeats.add(s.seatNo));
    if (window.appState?.playPop) window.appState.playPop();
    this.render('retro-log-view');
  }

  selectEven() {
    this.selectedSeats.clear();
    const students = this.store.getStudents(this.currentClassId);
    students.filter(s => s.seatNo % 2 === 0).forEach(s => this.selectedSeats.add(s.seatNo));
    if (window.appState?.playPop) window.appState.playPop();
    this.render('retro-log-view');
  }

  selectTag(tagId) {
    this.selectedTagId = tagId;
    const tag = this.store.getTags().find(t => t.id === tagId);
    if (tag) {
      this.customDelta = tag.delta;
    }
    if (window.appState?.playPop) window.appState.playPop();
    this.render('retro-log-view');
  }

  adjustDelta(diff) {
    this.customDelta += diff;
    if (window.appState?.playPop) window.appState.playPop();
    this.render('retro-log-view');
  }

  applyTemplate(text) {
    this.customNote = text;
    const input = document.getElementById('retro-memo-input');
    if (input) input.value = text;
    if (window.appState?.playPop) window.appState.playPop();
  }

  submitBatch() {
    if (this.selectedSeats.size === 0) {
      window.appState.showToast('請至少選取 1 位學生進行補記！', 'warning');
      return;
    }

    const tag = this.store.getTags().find(t => t.id === this.selectedTagId) || {
      name: '課堂記點',
      category: 'discipline'
    };

    const seatsArray = Array.from(this.selectedSeats);
    seatsArray.forEach(seatNo => {
      this.store.addEvent({
        classId: this.currentClassId,
        seatNo,
        period: this.selectedPeriod,
        tagId: this.selectedTagId || 'custom_retro',
        tagName: tag.name,
        category: tag.category || 'discipline',
        delta: this.customDelta,
        severity: this.customDelta > 0 ? 'positive' : this.customDelta < 0 ? 'warning' : 'neutral',
        note: `[事後補記] ${this.customNote}`.trim(),
        date: this.selectedDate
      });
    });

    if (this.customDelta > 0 && window.appState?.playChime) {
      window.appState.playChime();
    } else if (this.customDelta < 0 && window.appState?.playWarning) {
      window.appState.playWarning();
    }

    window.appState.showToast(`🎉 成功為 ${seatsArray.length} 位學生完成事後補記 (${this.customDelta > 0 ? '+' : ''}${this.customDelta}分)！🎀`, 'success');

    // Reset selection
    this.selectedSeats.clear();
    this.customNote = '';
    this.render('retro-log-view');
  }

  deleteRetroEvent(eventId) {
    if (confirm('確定要刪除這筆事後補記記錄嗎？')) {
      this.store.deleteEvent(eventId);
      window.appState.showToast('已刪除記錄', 'info');
      this.render('retro-log-view');
    }
  }
}

// --- test runner ---
/**
 * ClassQuant Hub - Milestone M1 Challenger 2 Browser Empirical Test Runner
 * Rigorous In-Browser Test Suite for:
 * 1. Retro Log View Seat Selection & O(1) In-Place Interaction Performance
 * 2. Quick Scoring Auto-Clear under Failure/Error Conditions (finally block verification)
 * 3. Floating Score Bubbles Visual Styling, Coordinates, and Non-Destructive Lifecycle
 */

(async function runChallenger2Tests() {
  const results = {
    total: 0,
    passed: 0,
    failed: 0,
    details: []
  };

  function assert(condition, suite, name, detail = '') {
    results.total++;
    if (condition) {
      results.passed++;
      results.details.push({ suite, name, passed: true, detail });
      console.log(`%c[PASS] [${suite}] ${name}`, 'color: #16a34a; font-weight: bold;');
    } else {
      results.failed++;
      results.details.push({ suite, name, passed: false, detail });
      console.error(`[FAIL] [${suite}] ${name}: ${detail}`);
    }
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // Setup Mock App State
  window.appState = {
    currentClassId: '801',
    isSoundEnabled: () => true,
    playPop: () => {},
    playChime: () => {},
    playWarning: () => {},
    showToast: (msg, type) => {},
    renderClassDropdown: () => {},
    switchTab: (tab) => {},
    closeModal: () => {
      const modal = document.getElementById('global-modal');
      if (modal) modal.classList.add('hidden');
    }
  };

  const store = window.appStore || new Store();
  const timetable = window.timetableEngine || new TimetableEngine(store);
  const statistics = window.statisticsEngine || new StatisticsEngine(store);
  const matrix = window.matrixView || new ClassroomMatrix(store, timetable, statistics);
  const retroLog = window.retroLogView || new RetroLogView(store);

  window.appStore = store;
  window.timetableEngine = timetable;
  window.statisticsEngine = statistics;
  window.matrixView = matrix;
  window.retroLogView = retroLog;

  console.log('Starting M1 Challenger 2 Empirical Test Runner in Browser...');

  // =========================================================================
  // SUITE 1: RetroLogView Seat Selection & In-Place Performance
  // =========================================================================
  const S1 = 'RetroLogView In-Place Seat Selection';

  try {
    // 1. Render retroLogView
    retroLog.render('retro-log-view', '801');
    const student1Card = document.getElementById('retro-student-1');
    assert(student1Card !== null, S1, 'Retro student card 1 rendered successfully');

    // 2. Test in-place toggleSeat on seat 1 without calling render()
    let renderCallCount = 0;
    const originalRender = retroLog.render.bind(retroLog);
    retroLog.render = function(...args) {
      renderCallCount++;
      return originalRender(...args);
    };

    const cardRefBefore = document.getElementById('retro-student-1');
    retroLog.toggleSeat(1);

    const cardRefAfter = document.getElementById('retro-student-1');
    const isNodePreserved = (cardRefBefore === cardRefAfter);
    assert(isNodePreserved, S1, 'toggleSeat(1) preserves exact DOM node identity (zero re-render)', `isNodePreserved=${isNodePreserved}`);
    assert(renderCallCount === 0, S1, 'toggleSeat(1) did not call render()', `renderCallCount=${renderCallCount}`);
    assert(retroLog.selectedSeats.has(1), S1, 'retroLog.selectedSeats contains seat 1 after toggle');
    assert(cardRefAfter.classList.contains('bg-pink-500'), S1, 'Card has selected background class bg-pink-500');
    assert(cardRefAfter.classList.contains('text-white'), S1, 'Card has selected text color text-white');

    const badge = document.getElementById('retro-selected-badge');
    assert(badge && badge.innerText.includes('已選取 1 人'), S1, 'Selection badge updated to "已選取 1 人"', badge?.innerText);

    const btnText = document.getElementById('retro-submit-btn-text');
    assert(btnText && btnText.innerText.includes('1 位學生'), S1, 'Submit button text updated to "1 位學生"', btnText?.innerText);

    // 3. Deselect seat 1
    retroLog.toggleSeat(1);
    assert(!retroLog.selectedSeats.has(1), S1, 'Seat 1 removed from selectedSeats on second tap');
    assert(renderCallCount === 0, S1, 'Deselect did not call render()', `renderCallCount=${renderCallCount}`);
    assert(cardRefAfter.classList.contains('bg-white'), S1, 'Card restored to unselected bg-white');
    assert(cardRefAfter.classList.contains('text-slate-800'), S1, 'Card restored to unselected text-slate-800');
    assert(badge && badge.innerText.includes('已選取 0 人'), S1, 'Selection badge updated to "已選取 0 人"');
    assert(btnText && btnText.innerText.includes('0 位學生'), S1, 'Submit button text updated to "0 位學生"');

    // Restore render
    retroLog.render = originalRender;

    // 4. Batch Selection Filters
    retroLog.selectOdd();
    const oddSeats = Array.from(retroLog.selectedSeats);
    const allOdd = oddSeats.every(s => s % 2 !== 0);
    assert(oddSeats.length > 0 && allOdd, S1, 'selectOdd() correctly selects all odd numbered students', `count=${oddSeats.length}`);

    retroLog.selectEven();
    const evenSeats = Array.from(retroLog.selectedSeats);
    const allEven = evenSeats.every(s => s % 2 === 0);
    assert(evenSeats.length > 0 && allEven, S1, 'selectEven() correctly selects all even numbered students', `count=${evenSeats.length}`);

    retroLog.selectAll();
    const allStudents = store.getStudents('801');
    assert(retroLog.selectedSeats.size === allStudents.length, S1, 'selectAll() selects 100% of class roster', `selected=${retroLog.selectedSeats.size}/${allStudents.length}`);

    retroLog.selectNone();
    assert(retroLog.selectedSeats.size === 0, S1, 'selectNone() clears all selections');

    // 5. Interaction Performance Benchmark: 1,000 rapid toggle operations
    const startTime = performance.now();
    for (let i = 0; i < 1000; i++) {
      const seatNo = (i % 30) + 1;
      retroLog.toggleSeat(seatNo);
    }
    const elapsed = performance.now() - startTime;
    assert(elapsed < 100, S1, `1,000 rapid in-place seat toggles executed in ${elapsed.toFixed(2)}ms (< 100ms threshold)`);

    // Reset selection after benchmark
    retroLog.selectNone();

    // 6. Batch Submit Workflow with Tag & Memo
    retroLog.toggleSeat(2);
    retroLog.toggleSeat(4);
    retroLog.customDelta = 3;
    retroLog.customNote = '數學分組討論表現優秀';
    
    let toastMessage = '';
    window.appState.showToast = (msg) => { toastMessage = msg; };

    const initialEventsCount = store.getEvents('801').length;
    retroLog.submitBatch();

    const postEvents = store.getEvents('801');
    const newEvents = postEvents.filter(e => e.note && e.note.includes('數學分組討論表現優秀'));
    assert(newEvents.length === 2, S1, 'submitBatch() created 2 new retro events in store', `count=${newEvents.length}`);
    assert(newEvents.every(e => e.delta === 3), S1, 'All new events have correct delta (+3)');
    assert(newEvents.some(e => e.seatNo === 2) && newEvents.some(e => e.seatNo === 4), S1, 'Events recorded for seat 2 and seat 4');
    assert(retroLog.selectedSeats.size === 0, S1, 'submitBatch() cleanly cleared selectedSeats');
    assert(toastMessage.includes('成功為 2 位學生完成事後補記'), S1, 'Success toast shown upon batch submit', toastMessage);

    // Test empty submit warning
    let warnToast = '';
    window.appState.showToast = (msg, type) => { if (type === 'warning') warnToast = msg; };
    retroLog.submitBatch();
    assert(warnToast.includes('請至少選取 1 位學生'), S1, 'submitBatch() prevents empty submissions with warning toast');
  } catch (err) {
    assert(false, S1, 'Unexpected error during Suite 1 execution', err.stack);
  }

  // =========================================================================
  // SUITE 2: Quick Scoring Auto-Clear Resilience (finally block verification)
  // =========================================================================
  const S2 = 'Quick Scoring Auto-Clear & Finally Resilience';

  try {
    matrix.render('classroom-matrix-view', '801');
    const tag = store.getTags()[0] || { id: 'tag_plus_1', name: '專注聽講', delta: 1, category: 'discipline' };

    // 1. Normal Flow Auto-Clear
    matrix.toggleSeat(1);
    matrix.toggleSeat(3);
    assert(matrix.selectedSeats.has(1) && matrix.selectedSeats.has(3), S2, 'Seats 1 and 3 selected');
    assert(document.getElementById('seat-card-1').classList.contains('selected'), S2, 'Seat 1 card has .selected class in DOM');

    matrix.applyTagToSelected('801', tag.id);
    assert(matrix.selectedSeats.size === 0, S2, 'Normal flow: matrix.selectedSeats is automatically cleared');
    assert(!document.getElementById('seat-card-1').classList.contains('selected'), S2, 'Seat 1 card has .selected class removed');
    assert(!document.getElementById('seat-card-3').classList.contains('selected'), S2, 'Seat 3 card has .selected class removed');
    assert(document.getElementById('selected-count').innerText === '0', S2, 'selected-count display reset to 0');
    assert(document.getElementById('clear-sel-btn').classList.contains('hidden'), S2, 'clear-sel-btn hidden after scoring');

    // 2. Resilience: Exception in timetable.detectActiveSlot()
    matrix.toggleSeat(2);
    matrix.toggleSeat(4);
    assert(matrix.selectedSeats.size === 2, S2, 'Seats 2 and 4 selected prior to simulated timetable crash');

    const origDetectSlot = matrix.timetable.detectActiveSlot;
    matrix.timetable.detectActiveSlot = () => {
      throw new Error('SIMULATED_TIMETABLE_EXCEPTION');
    };

    matrix.applyTagToSelected('801', tag.id);
    matrix.timetable.detectActiveSlot = origDetectSlot;

    assert(matrix.selectedSeats.size === 0, S2, 'Finally block clears selectedSeats even when timetable.detectActiveSlot throws', `size=${matrix.selectedSeats.size}`);
    assert(!document.getElementById('seat-card-2').classList.contains('selected'), S2, 'Seat 2 UI deselected after timetable crash');
    assert(!document.getElementById('seat-card-4').classList.contains('selected'), S2, 'Seat 4 UI deselected after timetable crash');

    // 3. Resilience: Exception in store.addEvent() (e.g. storage full / quota exceeded)
    matrix.toggleSeat(5);
    matrix.toggleSeat(6);
    assert(matrix.selectedSeats.size === 2, S2, 'Seats 5 and 6 selected prior to simulated store failure');

    const origAddEvent = matrix.store.addEvent;
    matrix.store.addEvent = () => {
      throw new Error('SIMULATED_QUOTA_EXCEEDED_ERROR');
    };

    matrix.applyTagToSelected('801', tag.id);
    matrix.store.addEvent = origAddEvent;

    assert(matrix.selectedSeats.size === 0, S2, 'Finally block clears selectedSeats even when store.addEvent throws');
    assert(!document.getElementById('seat-card-5').classList.contains('selected'), S2, 'Seat 5 UI deselected after store failure');
    assert(!document.getElementById('seat-card-6').classList.contains('selected'), S2, 'Seat 6 UI deselected after store failure');

    // 4. Resilience: Exception in showFloatingBubble()
    matrix.toggleSeat(7);
    const origBubble = matrix.showFloatingBubble;
    matrix.showFloatingBubble = () => {
      throw new Error('SIMULATED_BUBBLE_CREATION_ERROR');
    };

    matrix.applyTagToSelected('801', tag.id);
    matrix.showFloatingBubble = origBubble;

    assert(matrix.selectedSeats.size === 0, S2, 'Finally block clears selectedSeats even when showFloatingBubble throws');
    assert(!document.getElementById('seat-card-7').classList.contains('selected'), S2, 'Seat 7 UI deselected after bubble error');

    // 5. Resilience: Exception in audio / toast handlers
    matrix.toggleSeat(8);
    const origChime = window.appState.playChime;
    const origToast = window.appState.showToast;
    window.appState.playChime = () => { throw new Error('SIMULATED_AUDIO_ERROR'); };
    window.appState.showToast = () => { throw new Error('SIMULATED_TOAST_ERROR'); };

    matrix.applyTagToSelected('801', tag.id);
    window.appState.playChime = origChime;
    window.appState.showToast = origToast;

    assert(matrix.selectedSeats.size === 0, S2, 'Finally block clears selectedSeats even when audio/toast throws');
    assert(!document.getElementById('seat-card-8').classList.contains('selected'), S2, 'Seat 8 UI deselected after audio error');

    // 6. Score Span Index Target Correction Verification
    matrix.toggleSeat(9);
    const card9 = document.getElementById('seat-card-9');
    const spansBefore = card9.querySelectorAll('div > span');
    assert(spansBefore.length >= 3, S2, 'Seat card contains 3 score spans [SeatNo, AcademicScore, CharacterPts]');
    const academicBefore = spansBefore[1].innerText;

    matrix.applyTagToSelected('801', tag.id);

    const spansAfter = card9.querySelectorAll('div > span');
    const academicAfter = spansAfter[1].innerText;
    const charPtsAfter = spansAfter[2].innerText;

    assert(academicBefore === academicAfter, S2, 'Academic score span (scoreSpans[1]) remains intact and unmodified', `academicBefore=${academicBefore}, academicAfter=${academicAfter}`);
    assert(charPtsAfter.includes('+') || charPtsAfter !== '', S2, 'Character points span (scoreSpans[2]) successfully updated with point delta', `charPtsAfter=${charPtsAfter}`);
  } catch (err) {
    assert(false, S2, 'Unexpected error during Suite 2 execution', err.stack);
  }

  // =========================================================================
  // SUITE 3: Floating Score Bubbles Styling, Positioning & Non-Destructive Lifecycle
  // =========================================================================
  const S3 = 'Floating Score Bubbles Lifecycle & Non-Destructive Touch';

  try {
    matrix.render('classroom-matrix-view', '801');
    const card1 = document.getElementById('seat-card-1');

    // 1. Spawn a positive floating bubble
    matrix.showFloatingBubble(1, 3);
    const bubblePos = card1.querySelector('.point-bubble');
    assert(bubblePos !== null, S3, 'Floating bubble element appended to target seat card');
    assert(bubblePos.innerText.includes('3'), S3, 'Positive bubble displays point value 3', bubblePos?.innerText);
    assert(bubblePos.classList.contains('text-emerald-600'), S3, 'Positive bubble has class text-emerald-600');
    assert(bubblePos.style.pointerEvents === 'none', S3, 'Bubble has style.pointerEvents = "none"');

    // 2. Check CSS Computed Styles for .point-bubble
    const computed = window.getComputedStyle(bubblePos);
    assert(computed.pointerEvents === 'none', S3, 'Computed pointer-events is "none"');
    assert(computed.position === 'absolute', S3, 'Computed position is "absolute"');
    assert(computed.zIndex === '50', S3, 'Computed zIndex is 50');

    // 3. Pointer Events Non-Blocking Passthrough verification
    const bubbleRect = bubblePos.getBoundingClientRect();
    const midX = bubbleRect.left + (bubbleRect.width / 2);
    const midY = bubbleRect.top + (bubbleRect.height / 2);
    const hitElement = document.elementFromPoint(midX, midY);
    const penetratesBubble = (hitElement !== bubblePos);
    assert(penetratesBubble, S3, 'document.elementFromPoint penetrates floating bubble (pointer-events: none verified)', `hitElement=${hitElement?.tagName}.${hitElement?.className}`);

    // 4. Spawn a negative floating bubble
    const card2 = document.getElementById('seat-card-2');
    matrix.showFloatingBubble(2, -2);
    const bubbleNeg = card2.querySelector('.point-bubble');
    assert(bubbleNeg !== null, S3, 'Negative floating bubble appended to seat card 2');
    assert(bubbleNeg.innerText === '-2', S3, 'Negative bubble displays "-2"', bubbleNeg?.innerText);
    assert(bubbleNeg.classList.contains('text-rose-600'), S3, 'Negative bubble has class text-rose-600');

    // 5. Automatic DOM Cleanup verification (800ms)
    console.log('Waiting 850ms for bubble automatic cleanup...');
    await sleep(850);

    const bubblePosAfter = card1.querySelector('.point-bubble');
    const bubbleNegAfter = card2.querySelector('.point-bubble');
    assert(bubblePosAfter === null, S3, 'Positive bubble cleanly removed from DOM after 800ms timeout');
    assert(bubbleNegAfter === null, S3, 'Negative bubble cleanly removed from DOM after 800ms timeout');

    // 6. Rapid Spam Stress: 100 Bubbles on single card
    console.log('Spamming 100 bubbles rapidly on seat card 1...');
    const originalChildrenCount = card1.children.length;
    for (let i = 0; i < 100; i++) {
      matrix.showFloatingBubble(1, (i % 2 === 0) ? 1 : -1);
    }
    const bubblesDuringSpam = card1.querySelectorAll('.point-bubble').length;
    assert(bubblesDuringSpam === 100, S3, '100 floating bubbles concurrently mounted without crash', `count=${bubblesDuringSpam}`);

    console.log('Waiting 900ms for all 100 bubbles to auto-remove...');
    await sleep(900);

    const bubblesAfterSpam = card1.querySelectorAll('.point-bubble').length;
    assert(bubblesAfterSpam === 0, S3, 'All 100 floating bubbles cleanly removed from DOM with zero leaks', `remaining=${bubblesAfterSpam}`);
    assert(card1.children.length === originalChildrenCount, S3, 'Seat card original DOM structure preserved intact');

    // 7. Non-existent seat card safety
    let thrown = false;
    try {
      matrix.showFloatingBubble(99999, 5);
    } catch (e) {
      thrown = true;
    }
    assert(!thrown, S3, 'showFloatingBubble handles non-existent seat number safely with zero exception');

  } catch (err) {
    assert(false, S3, 'Unexpected error during Suite 3 execution', err.stack);
  }

  // Expose to window for CDP evaluation
  window.__M1_CHALLENGER2_RESULTS__ = results;
  window.__STRESS_TEST_RESULTS__ = results;

  const summaryEl = document.getElementById('summary-json');
  const summaryScript = document.getElementById('summary-data');
  const statusEl = document.getElementById('status');
  if (summaryEl) summaryEl.innerText = JSON.stringify(results, null, 2);
  if (summaryScript) summaryScript.textContent = JSON.stringify(results);
  if (statusEl) {
    statusEl.innerHTML = results.failed === 0
      ? `<span class="pass">🎉 ALL ${results.total} BROWSER TESTS PASSED (100% Success Rate)</span>`
      : `<span class="fail">❌ ${results.failed} TEST(S) FAILED</span>`;
  }

  console.log('M1 Challenger 2 Test Results:', results);

  // Send report to server if running under HTTP test harness
  try {
    await fetch('/api/test-report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(results)
    });
  } catch (e) {
    // Expected when running via file://
  }
})();
