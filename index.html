<!DOCTYPE html>
<html lang="zh-TW" data-theme="kitty">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClassQuant Hub • 國中導師與數學科任戰情室</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f43f5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClassQuant">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f43f5e'/%3E%3Cpath d='M30 45 C30 35 40 28 50 28 C60 28 70 35 70 45 C70 58 60 65 50 65 C40 65 30 58 30 45 Z' fill='%23ffffff'/%3E%3Cellipse cx='42' cy='46' rx='3' ry='4.5' fill='%23222'/%3E%3Cellipse cx='58' cy='46' rx='3' ry='4.5' fill='%23222'/%3E%3Cellipse cx='50' cy='53' rx='3.5' ry='2.5' fill='%23fbbf24'/%3E%3Cpath d='M62 32 C65 26 74 26 77 31 C79 35 75 40 70 39 C72 44 68 49 63 47 C58 45 59 38 62 32 Z' fill='%23ef4444'/%3E%3Ccircle cx='66' cy='36' r='3.5' fill='%23ffedd5'/%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js CDN with BoxPlot Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.4/build/index.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Zen Maru Gothic & Nunito for Kawaii look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/kitty-theme.css">
  <link rel="stylesheet" href="./css/sanrio-characters.css">
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300 font-sans selection:bg-pink-300 selection:text-pink-900">

  <!-- Floating Unhide Button (Visible only when Header is Collapsed) -->
  <div id="header-unhide-pill" class="hidden fixed top-2 left-1/2 -translate-x-1/2 z-50 animate-bounce">
    <button onclick="appState.toggleHeader(true)" class="px-4 py-1.5 rounded-full bg-white/95 backdrop-blur border-2 border-pink-300 shadow-lg text-xs font-black text-pink-600 hover:bg-pink-50 transition flex items-center gap-1.5 active:scale-95">
      <span class="kitty-bow !w-3 !h-3"></span>
      <span>▼ 展開頂部選單 (ClassQuant)</span>
    </button>
  </div>

  <!-- Top Global Header with Collapsible Mascot Banner -->
  <header id="global-header" class="sticky top-0 z-40 glass-card border-b px-3 sm:px-6 py-2">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      
      <!-- Brand with Authentic Hello Kitty & Little Twin Stars Mascots -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <div class="flex items-center space-x-1 bg-white px-1.5 py-0.5 rounded-2xl shadow-sm border border-pink-200">
          <div class="kitty-cat-avatar cursor-pointer !w-8 !h-8 sm:!w-10 sm:!h-10" onclick="appState.showToast('Hello Kitty 陪伴老師一起快樂教學！🎀', 'info')" title="Hello Kitty"></div>
          <div class="sanrio-twinstars-badge cursor-pointer !w-8 !h-8 sm:!w-10 sm:!h-10" onclick="appState.showToast('小雙星 Kiki & Lala 守護班級每一顆星星！✨', 'info')" title="Little Twin Stars (Kiki & Lala)"></div>
        </div>

        <div>
          <div class="flex items-center space-x-1.5">
            <h1 class="text-sm sm:text-lg font-black tracking-wide flex items-center gap-1 text-pink-600">
              ClassQuant Hub
              <span class="kitty-bow !w-3.5 !h-3.5"></span>
            </h1>
            <button id="header-version-badge" onclick="appState.openBulletinModal()" class="text-[10px] px-2 py-0.2 rounded-full font-bold bg-pink-100 text-pink-700 border border-pink-300 hover:bg-pink-200 transition active:scale-95 cursor-pointer flex items-center gap-0.5" title="查看公佈欄與更新日誌">
              <span>v1.8.6</span>
              <span>📢</span>
            </button>
          </div>
          <div class="flex items-center space-x-1.5 text-[11px] opacity-80">
            <span id="header-live-clock" class="font-mono font-semibold">載入時間...</span>
            <span>•</span>
            <div id="header-schedule-status" class="flex items-center space-x-1">
              <span class="w-2 h-2 rounded-full bg-emerald-500 live-indicator"></span>
              <span class="text-emerald-600 font-bold">自動感知中</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Header Controls: Class Select, Sound, Theme, Collapse Header, PWA Install -->
      <div class="flex items-center space-x-1 sm:space-x-2">
        <!-- PWA Install Button -->
        <button id="pwa-install-btn" onclick="appState.installPWA()" 
          class="hidden sm:flex px-2.5 py-1 text-xs font-bold rounded-xl bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white shadow-md transition items-center gap-1">
          <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
          <span>安裝 App</span>
        </button>

        <!-- Onboarding Tour Button (新手實戰教學) -->
        <button id="onboarding-guide-btn" onclick="onboardingTour.start(0)" 
          class="px-2.5 sm:px-3 py-1 rounded-xl border border-pink-300 bg-white hover:bg-pink-50 text-pink-700 transition flex items-center gap-1 shadow-sm active:scale-95 shrink-0" title="開啟新手教學">
          <span class="text-xs font-black">🎓</span>
          <span class="text-xs font-bold text-pink-700">新手教學</span>
        </button>

        <!-- Sound Toggle Button -->
        <button id="sound-toggle-btn" onclick="appState.toggleSound()" 
          class="p-1.5 sm:px-2 sm:py-1 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center gap-1 shadow-sm bg-white" title="操作音效切換">
          <i data-lucide="volume-2" class="w-4 h-4 text-pink-600"></i>
        </button>

        <!-- Theme Switcher Button -->
        <button id="theme-toggle-btn" onclick="appState.toggleTheme()" 
          class="p-1.5 sm:px-2.5 sm:py-1 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center gap-1 shadow-sm bg-white" title="切換主題">
          <span class="kitty-bow !w-3.5 !h-3.5"></span>
          <span class="text-xs font-bold text-pink-600 ml-0.5 hidden md:inline">主題</span>
        </button>


        <!-- Class Dropdown -->
        <div class="flex items-center space-x-1 border border-pink-300 rounded-xl px-2 py-1 shadow-inner bg-white">
          <i data-lucide="users" class="w-3.5 h-3.5 text-pink-500"></i>
          <select id="global-class-select" onchange="appState.handleManualClassChange(this.value)" 
            class="bg-transparent text-xs font-bold focus:outline-none cursor-pointer pr-1 text-slate-800">
            <!-- Populated via JS -->
          </select>
        </div>

        <!-- 1-Tap Header Collapse Button -->
        <button onclick="appState.toggleHeader()" 
          class="p-1.5 sm:px-2 sm:py-1 rounded-xl border border-pink-200 bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold text-xs transition flex items-center gap-1 shadow-sm" title="收合頂部橫幅">
          <i data-lucide="chevron-up" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Navigation Tab Bar -->
  <nav class="glass-card border-b px-2 sm:px-6 sticky top-0 z-30 overflow-x-auto no-scrollbar">
    <div class="max-w-7xl mx-auto flex items-center space-x-1 sm:space-x-2 py-1">
      <button onclick="appState.switchTab('matrix')" data-tab="matrix" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5 text-pink-500"></i>
        <span>課堂點記板</span>
      </button>

      <button onclick="appState.switchTab('roster')" data-tab="roster" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap text-pink-700 bg-pink-50/50">
        <i data-lucide="user-plus" class="w-3.5 h-3.5 text-pink-600"></i>
        <span>👥 班級名單</span>
      </button>

      <button onclick="appState.switchTab('retro')" data-tab="retro" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap text-amber-800 bg-amber-50/60 border border-amber-200">
        <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-600"></i>
        <span>⏰ 課堂事後補記</span>
      </button>

      <button onclick="appState.switchTab('dashboard')" data-tab="dashboard" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="pie-chart" class="w-3.5 h-3.5 text-purple-500"></i>
        <span>統計戰情室</span>
      </button>

      <button onclick="appState.switchTab('timetable')" data-tab="timetable" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="calendar" class="w-3.5 h-3.5 text-sky-500"></i>
        <span>課表排程</span>
      </button>

      <button onclick="appState.switchTab('events')" data-tab="events" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="book-open" class="w-3.5 h-3.5 text-emerald-500"></i>
        <span>學生記事檢索</span>
      </button>

      <button onclick="appState.switchTab('student-dossier')" data-tab="student-dossier" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="user-check" class="w-3.5 h-3.5 text-amber-500"></i>
        <span>檔案 & 晤談</span>
      </button>

      <button onclick="appState.switchTab('ai-hub')" data-tab="ai-hub" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
        <i data-lucide="bot" class="w-3.5 h-3.5 text-purple-500"></i>
        <span>AI 成績匯入</span>
      </button>

      <button onclick="appState.openBulletinModal()" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap text-amber-900 bg-amber-50 hover:bg-amber-100 border border-amber-300 font-black shadow-sm">
        <i data-lucide="bell" class="w-3.5 h-3.5 text-amber-600"></i>
        <span>📢 公佈欄 & 更新日誌</span>
      </button>

      <button onclick="appState.switchTab('guide')" data-tab="guide" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap text-pink-700 bg-pink-100 border border-pink-300 font-black">
        <i data-lucide="help-circle" class="w-3.5 h-3.5 text-pink-600"></i>
        <span>📖 圖文說明書</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2.5 sm:p-6">
    <!-- Tab 1: Classroom Matrix View -->
    <section id="classroom-matrix-view" class="tab-panel animate-fade-in-up"></section>

    <!-- Tab 2: Class & Student Roster Manager View -->
    <section id="roster-manager-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 3: Dedicated Post-Class Retro-Logging View -->
    <section id="retro-log-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 4: Class Dashboard View -->
    <section id="dashboard-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 5: Timetable View -->
    <section id="timetable-editor-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 6: Events Log & Narrative Notes View -->
    <section id="events-log-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 7: Student Dossier View -->
    <section id="student-dossier-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 8: AI Hub & Schema View -->
    <section id="ai-hub-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 9: Visual User Guide View -->
    <section id="user-guide-view" class="tab-panel hidden animate-fade-in-up"></section>
  </main>

  <!-- Floating Quick Guide Button on Bottom-Left (Hidden on small mobile) -->
  <button onclick="appState.switchTab('guide')" class="hidden sm:flex floating-guide-btn px-4 py-2.5 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-bold text-xs shadow-xl transition items-center gap-2">
    <span class="kitty-bow"></span>
    <span>💡 點我看圖文說明書</span>
  </button>

  <!-- Global Footer -->
  <footer class="hidden sm:flex glass-card border-t py-3.5 px-6 text-center text-xs opacity-85 items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="kitty-cat-mini"></span>
      <span class="font-black text-pink-600">ClassQuant Hub v1.3.0</span>
      <span class="text-slate-500">| 三麗鷗家族陪伴國中教師因材施教</span>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="appState.checkForUpdates(false)" class="text-pink-600 hover:underline font-bold flex items-center gap-1">
        <i data-lucide="refresh-cw" class="w-3 h-3"></i> 檢查更新
      </button>
      <span class="text-slate-300">•</span>
      <span class="text-slate-500">已部署至 GitHub Pages</span>
    </div>
  </footer>

  <!-- Global Modal Container -->
  <div id="global-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-card rounded-3xl w-full max-w-lg overflow-hidden border border-pink-300 shadow-2xl relative bg-white" id="global-modal-content">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Global Toast Container -->
  <div id="global-toast" class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-2xl border text-xs font-bold shadow-2xl flex items-center gap-2 transition-all transform duration-300 translate-y-20 opacity-0 pointer-events-none"></div>

  <!-- Application Logic Scripts (Bust stale caches with version tag) -->
  <script src="./js/store.js?v=1.8.6"></script>
  <script src="./js/timetable.js?v=1.8.6"></script>
  <script src="./js/statistics.js?v=1.8.6"></script>
  <script src="./js/charts.js?v=1.8.6"></script>
  <script src="./js/sortable.min.js?v=1.8.6"></script>
  <script src="./js/tagManager.js?v=1.8.6"></script>
  <script src="./js/matrix.js?v=1.8.6"></script>
  <script src="./js/rosterManager.js?v=1.8.6"></script>
  <script src="./js/retroLogView.js?v=1.8.6"></script>
  <script src="./js/eventsLog.js?v=1.8.6"></script>
  <script src="./js/studentDossier.js?v=1.8.6"></script>
  <script src="./js/timetableEditor.js?v=1.8.6"></script>
  <script src="./js/aiImportExport.js?v=1.8.6"></script>
  <script src="./js/onboardingTour.js?v=1.8.6"></script>
  <script src="./js/onboardingWizard.js?v=1.8.6"></script>
  <script src="./js/userGuide.js?v=1.8.6"></script>
  <script src="./js/app.js?v=1.8.6"></script>

  <!-- Register Service Worker for 100% Offline PWA functionality -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => {
            console.log('ClassQuant Hub Service Worker Registered!', reg.scope);
            // Proactively check for Service Worker updates on every launch
            reg.update();
          })
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
