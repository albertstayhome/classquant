<!DOCTYPE html>
<html lang="zh-TW" data-theme="kitty">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClassQuant Hub • 國中導師與數學科任戰情室</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f43f5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClassQuant">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f43f5e'/%3E%3Cpath d='M30 45 C30 35 40 28 50 28 C60 28 70 35 70 45 C70 58 60 65 50 65 C40 65 30 58 30 45 Z' fill='%23ffffff'/%3E%3Cellipse cx='42' cy='46' rx='3' ry='4.5' fill='%23222'/%3E%3Cellipse cx='58' cy='46' rx='3' ry='4.5' fill='%23222'/%3E%3Cellipse cx='50' cy='53' rx='3.5' ry='2.5' fill='%23fbbf24'/%3E%3Cpath d='M62 32 C65 26 74 26 77 31 C79 35 75 40 70 39 C72 44 68 49 63 47 C58 45 59 38 62 32 Z' fill='%23ef4444'/%3E%3Ccircle cx='66' cy='36' r='3.5' fill='%23ffedd5'/%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js CDN with BoxPlot Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.4/build/index.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Zen Maru Gothic & Nunito for Kawaii look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="./css/styles.css?v=1.6.0">
  <link rel="stylesheet" href="./css/kitty-theme.css?v=1.6.0">
  <link rel="stylesheet" href="./css/sanrio-characters.css?v=1.6.0">
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300 font-sans selection:bg-pink-300 selection:text-pink-900">

  <!-- Top Global Header with Collapsible Mascot Banner -->
  <header id="global-header" class="sticky top-0 z-40 glass-card border-b px-3 sm:px-6 py-2">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      
      <!-- Brand with Authentic Hello Kitty & Little Twin Stars Mascots -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <div class="flex items-center space-x-1 bg-white px-1.5 py-0.5 rounded-2xl shadow-sm border border-pink-200">
          <div class="kitty-cat-avatar cursor-pointer !w-8 !h-8 sm:!w-10 sm:!h-10" onclick="appState.showToast('Hello Kitty 陪伴老師一起快樂教學！🎀', 'info')" title="Hello Kitty"></div>
          <div class="sanrio-twinstars-badge cursor-pointer !w-8 !h-8 sm:!w-10 sm:!h-10" onclick="appState.showToast('小雙星 Kiki & Lala 守護班級每一顆星星！✨', 'info')" title="Little Twin Stars (Kiki & Lala)"></div>
        </div>

        <div>
          <div class="flex items-center space-x-1.5">
            <h1 class="text-sm sm:text-lg font-black tracking-wide flex items-center gap-1 text-pink-600">
              ClassQuant Hub
              <span class="kitty-bow !w-3.5 !h-3.5"></span>
            </h1>
            <button id="header-version-badge" onclick="appState.openBulletinModal()" class="text-[10px] px-2 py-0.2 rounded-full font-bold bg-pink-100 text-pink-700 border border-pink-300 hover:bg-pink-200 transition active:scale-95 cursor-pointer flex items-center gap-0.5" title="查看公佈欄與更新日誌">
              <span>v1.7.9</span>
              <span>📢</span>
            </button>
          </div>
          <div class="flex items-center space-x-1.5 text-[11px] opacity-80">
            <span id="header-live-clock" class="font-mono font-semibold">載入時間...</span>
            <span>•</span>
            <div id="header-schedule-status" class="flex items-center space-x-1">
              <span class="w-2 h-2 rounded-full bg-emerald-500 live-indicator"></span>
              <span class="text-emerald-600 font-bold">自動感知中</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Header Controls: Class Select, Sound, Theme, Collapse Header, PWA Install -->
      <div class="flex items-center flex-wrap sm:flex-nowrap gap-1 sm:gap-1.5 justify-end max-w-full">
        <!-- PWA Install Button -->
        <button id="pwa-install-btn" onclick="appState.installPWA()" 
          class="hidden sm:flex px-2.5 py-1 text-xs font-bold rounded-xl bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white shadow-md transition items-center gap-1">
          <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
          <span>安裝 App</span>
        </button>

        <!-- Onboarding Tour Button (新手實戰教學) -->
        <button id="onboarding-guide-btn" onclick="appState.startTour()" 
          class="px-2 sm:px-2.5 py-1 rounded-xl border border-pink-300 bg-white hover:bg-pink-50 text-pink-700 transition flex items-center gap-1 shadow-sm active:scale-95 shrink-0 cursor-pointer" title="開啟新手教學">
          <span class="text-xs font-black">🎓</span>
          <span class="text-xs font-bold text-pink-700">教學</span>
        </button>

        <!-- Sound Toggle Button -->
        <button id="sound-toggle-btn" onclick="appState.toggleSound()" 
          class="p-1 sm:p-1.5 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center gap-1 shadow-sm bg-white shrink-0" title="操作音效切換">
          <i data-lucide="volume-2" class="w-4 h-4 text-pink-600"></i>
        </button>

        <!-- Theme Switcher Button -->
        <button id="theme-toggle-btn" onclick="appState.toggleTheme()" 
          class="p-1 sm:p-1.5 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center gap-1 shadow-sm bg-white shrink-0" title="切換主題">
          <span class="kitty-bow !w-3.5 !h-3.5"></span>
        </button>

        <!-- Class Dropdown -->
        <div class="flex items-center space-x-1 border border-pink-300 rounded-xl px-2 py-1 shadow-inner bg-white min-w-0">
          <i data-lucide="users" class="w-3.5 h-3.5 text-pink-500 shrink-0"></i>
          <select id="global-class-select" onchange="appState.handleManualClassChange(this.value)" 
            class="bg-transparent text-xs font-bold focus:outline-none cursor-pointer pr-1 text-slate-800 max-w-[115px] sm:max-w-[160px] truncate">
            <!-- Populated via JS -->
          </select>
        </div>

        <!-- 1-Tap Header Collapse Button (Always in view) -->
        <button onclick="appState.toggleHeader()" 
          class="p-1.5 rounded-xl border border-pink-300 bg-pink-100/80 hover:bg-pink-200 text-pink-700 font-bold text-xs transition flex items-center justify-center shadow-sm shrink-0 active:scale-95 cursor-pointer" title="收合頂部橫幅">
          <i data-lucide="chevron-up" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Navigation Tab Bar -->
  <nav class="glass-card border-b px-2 sm:px-6 sticky top-0 z-30 overflow-x-auto no-scrollbar">
    <div class="max-w-7xl mx-auto flex items-center justify-between py-1">
      <div class="flex items-center space-x-1 sm:space-x-2">
        <button onclick="appState.switchTab('matrix')" data-tab="matrix" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="layout-grid" class="w-3.5 h-3.5 text-pink-500"></i>
          <span>課堂點記板</span>
        </button>

        <button onclick="appState.switchTab('roster')" data-tab="roster" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap text-pink-700 bg-pink-50/50">
          <i data-lucide="user-plus" class="w-3.5 h-3.5 text-pink-600"></i>
          <span>👥 班級名單</span>
        </button>

        <button onclick="appState.switchTab('retro')" data-tab="retro" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap text-amber-800 bg-amber-50/60 border border-amber-200">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-600"></i>
          <span>⏰ 課堂事後補記</span>
        </button>

        <button onclick="appState.switchTab('dashboard')" data-tab="dashboard" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="pie-chart" class="w-3.5 h-3.5 text-purple-500"></i>
          <span>統計戰情室</span>
        </button>

        <button onclick="appState.switchTab('timetable')" data-tab="timetable" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-sky-500"></i>
          <span>課表排程</span>
        </button>

        <button onclick="appState.switchTab('events')" data-tab="events" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="book-open" class="w-3.5 h-3.5 text-emerald-500"></i>
          <span>學生記事檢索</span>
        </button>

        <button onclick="appState.switchTab('student-dossier')" data-tab="student-dossier" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="user-check" class="w-3.5 h-3.5 text-amber-500"></i>
          <span>檔案 & 晤談</span>
        </button>

        <button onclick="appState.switchTab('ai-hub')" data-tab="ai-hub" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap">
          <i data-lucide="bot" class="w-3.5 h-3.5 text-purple-500"></i>
          <span>AI 成績匯入</span>
        </button>

        <button onclick="appState.openBulletinModal()" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap text-amber-900 bg-amber-50 hover:bg-amber-100 border border-amber-300 font-black shadow-sm">
          <i data-lucide="bell" class="w-3.5 h-3.5 text-amber-600"></i>
          <span>📢 公佈欄 & 更新日誌</span>
        </button>

        <button onclick="appState.switchTab('guide')" data-tab="guide" class="nav-tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap text-pink-700 bg-pink-100 border border-pink-300 font-black">
          <i data-lucide="help-circle" class="w-3.5 h-3.5 text-pink-600"></i>
          <span>📖 圖文說明書</span>
        </button>
      </div>

      <!-- Integrated Expand Header Button (Inside Navbar, NEVER blocks page content!) -->
      <div id="nav-unhide-container" class="hidden shrink-0 pl-2">
        <button onclick="appState.toggleHeader(true)" class="px-2.5 py-1 rounded-xl bg-pink-100/90 text-pink-700 border border-pink-300 hover:bg-pink-200 text-xs font-black transition flex items-center gap-1 shadow-sm shrink-0 whitespace-nowrap active:scale-95 cursor-pointer" title="展開頂部橫幅">
          <span class="kitty-bow !w-3 !h-3"></span>
          <span>▼ 展開選單</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2.5 sm:p-6">
    <!-- Tab 1: Classroom Matrix View -->
    <section id="classroom-matrix-view" class="tab-panel animate-fade-in-up"></section>

    <!-- Tab 2: Class & Student Roster Manager View -->
    <section id="roster-manager-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 3: Dedicated Post-Class Retro-Logging View -->
    <section id="retro-log-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 4: Class Dashboard View -->
    <section id="dashboard-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 5: Timetable View -->
    <section id="timetable-editor-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 6: Events Log & Narrative Notes View -->
    <section id="events-log-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 7: Student Dossier View -->
    <section id="student-dossier-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 8: AI Hub & Schema View -->
    <section id="ai-hub-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 9: Visual User Guide View -->
    <section id="user-guide-view" class="tab-panel hidden animate-fade-in-up"></section>
  </main>

  <!-- Floating Quick Guide Button on Bottom-Left (Hidden on small mobile) -->
  <button onclick="appState.switchTab('guide')" class="hidden sm:flex floating-guide-btn px-4 py-2.5 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-bold text-xs shadow-xl transition items-center gap-2">
    <span class="kitty-bow"></span>
    <span>💡 點我看圖文說明書</span>
  </button>

  <!-- Global Footer -->
  <footer class="hidden sm:flex glass-card border-t py-3.5 px-6 text-center text-xs opacity-85 items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="kitty-cat-mini"></span>
      <span class="font-black text-pink-600">ClassQuant Hub v1.7.9</span>
      <span class="text-slate-500">| 三麗鷗家族陪伴國中教師因材施教</span>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="appState.checkForUpdates(false)" class="text-pink-600 hover:underline font-bold flex items-center gap-1">
        <i data-lucide="refresh-cw" class="w-3 h-3"></i> 檢查更新
      </button>
      <span class="text-slate-300">•</span>
      <span class="text-slate-500">已部署至 GitHub Pages</span>
    </div>
  </footer>

  <!-- Global Modal Container -->
  <div id="global-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-card rounded-3xl w-full max-w-lg overflow-hidden border border-pink-300 shadow-2xl relative bg-white" id="global-modal-content">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <!-- Global Toast Container -->
  <div id="global-toast" class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-2xl border text-xs font-bold shadow-2xl flex items-center gap-2 transition-all transform duration-300 translate-y-20 opacity-0 pointer-events-none"></div>

  <!-- Permanent Static Onboarding Tour Container (Zero Dynamic Overhead) -->
  <div id="tour-overlay-container" class="fixed inset-0 pointer-events-none hidden" style="z-index: 99999;">
    <!-- Industry Standard SVG Mask Layer (GPU Composited) -->
    <svg id="tour-svg-overlay" class="absolute inset-0 w-full h-full pointer-events-none tour-gpu-layer" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="tour-glow-filter" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f43f5e" flood-opacity="0.9" />
          <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fb7185" flood-opacity="0.65" />
        </filter>
        <linearGradient id="tour-glow-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f43f5e" />
          <stop offset="50%" stop-color="#fb7185" />
          <stop offset="100%" stop-color="#f43f5e" />
        </linearGradient>
      </defs>
      <!-- Dark Backdrop Mask with Rounded Cutout -->
      <path id="tour-overlay-path" d="" fill="rgba(15, 23, 42, 0.78)" fill-rule="evenodd" style="pointer-events: auto;"></path>
      <!-- Outer Radar Pulse Halo -->
      <rect id="tour-spotlight-halo" x="0" y="0" width="0" height="0" rx="0" ry="0" fill="none" stroke="#fb7185" stroke-width="2" class="tour-pulse-halo pointer-events-none" style="pointer-events: none;"></rect>
      <!-- Synchronized Glowing Outline Accent -->
      <rect id="tour-spotlight-glow" x="0" y="0" width="0" height="0" rx="14" ry="14" fill="none" stroke="url(#tour-glow-stroke)" stroke-width="3" filter="url(#tour-glow-filter)" class="tour-spotlight-pulse pointer-events-none" style="pointer-events: none;"></rect>
    </svg>

    <!-- Calibrated Vector SVG Ghost Cursor Layer -->
    <div id="tour-ghost-cursor" class="fixed pointer-events-none will-change-transform opacity-0 hidden" style="top: 0; left: 0; transform: translate3d(0, 0, 0); transition: opacity 0.2s ease-out; z-index: 100002;">
      <div id="tour-ghost-cursor-body" class="relative pointer-events-none flex items-center justify-center" style="width: 40px; height: 42px; transform-origin: 14px 2.5px;">
        <svg id="tour-ghost-svg" width="40" height="42" viewBox="0 0 40 42" fill="none" xmlns="http://www.w3.org/2000/svg" class="filter drop-shadow-[0_4px_12px_rgba(244,63,94,0.45)]">
          <defs>
            <linearGradient id="ghost-hand-skin" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="60%" stop-color="#fff5f5" />
              <stop offset="100%" stop-color="#ffe4e6" />
            </linearGradient>
          </defs>
          <g>
            <path d="M10.5 16.5V4.5C10.5 2.57 12.07 1 14 1C15.93 1 17.5 2.57 17.5 4.5V14.25M17.5 14.25V7.5C17.5 5.84 18.84 4.5 20.5 4.5C22.16 4.5 23.5 5.84 23.5 7.5V14.25M23.5 14.25V9.75C23.5 8.09 24.84 6.75 26.5 6.75C28.16 6.75 29.5 8.09 29.5 9.75V15.75M29.5 15.75V12C29.5 10.34 30.84 9 32.5 9C34.16 9 35.5 10.34 35.5 12V22.5C35.5 29.13 30.13 34.5 23.5 34.5H18.25C14.11 34.5 10.28 32.35 8.1 28.84L4.8 23.53C3.65 21.68 4.22 19.26 6.07 18.11C7.92 16.96 10.34 17.53 11.49 19.38L13.5 22.5" 
              fill="url(#ghost-hand-skin)" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="14" cy="2.5" r="2.5" fill="#f43f5e" />
          </g>
        </svg>
        <div id="tour-ghost-ripple" class="hidden"></div>
      </div>
    </div>

    <!-- Static 4-Way Directional Pointer -->
    <div id="tour-pointer-container" class="fixed pointer-events-none hidden will-change-transform tour-gpu-layer" style="top: 0; left: 0; transform: translate3d(0, 0, 0); z-index: 100000;">
      <div id="tour-pointer-inner" class="flex flex-col items-center justify-center pointer-events-none">
        <div id="tour-arrow-up" class="tour-arrow-icon text-3xl filter drop-shadow-[0_4px_12px_rgba(244,63,94,0.95)] hidden" style="display: none;">👆</div>
        <div id="tour-pointer-badge" class="bg-gradient-to-r from-pink-600 to-rose-600 text-white font-black text-[11px] px-3.5 py-1 rounded-full shadow-2xl border-1.5 border-white whitespace-nowrap flex items-center gap-1">
          <span id="tour-arrow-left" class="tour-arrow-lateral hidden text-sm" style="display: none;">👈</span>
          <span id="tour-pointer-text">請點擊此處</span>
          <span id="tour-arrow-right" class="tour-arrow-lateral hidden text-sm" style="display: none;">👉</span>
        </div>
        <div id="tour-arrow-down" class="tour-arrow-icon text-3xl filter drop-shadow-[0_4px_12px_rgba(244,63,94,0.95)] hidden" style="display: none;">👇</div>
      </div>
    </div>

    <!-- Viewport-Safe Popover Card -->
    <div id="tour-popover" class="fixed left-3 right-3 sm:left-1/2 sm:-translate-x-1/2 sm:w-[380px] bg-white rounded-3xl p-4 shadow-2xl border-2 border-pink-300 pointer-events-auto transition-all duration-300" style="z-index: 100001; bottom: 14px; top: auto;">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-pink-100">
        <div class="flex items-center space-x-2">
          <span class="kitty-bow !w-3.5 !h-3.5"></span>
          <span id="tour-step-badge" class="text-[11px] font-black px-2.5 py-0.5 rounded-full bg-pink-100 text-pink-700">步驟 1 / 12</span>
        </div>
        <button onclick="onboardingTour.endTour()" class="text-xs font-bold text-slate-400 hover:text-pink-600 transition cursor-pointer" title="結束教學">
          ✕ 結束
        </button>
      </div>
      <h4 id="tour-title" class="text-sm sm:text-base font-black text-slate-900 mb-1.5 flex items-center gap-1.5">1. 班級切換樞紐 (點擊展開)</h4>
      <div id="tour-content" class="text-xs text-slate-600 mb-3 leading-relaxed">這裡是你管理班級的核心！<strong>請點擊下拉選單</strong>，看看裡面為各班獨立保存的分數與名單。</div>
      <div id="tour-action-container" class="flex items-center justify-end pt-1">
        <div class="flex items-center gap-2 w-full justify-between pt-1">
          <div class="px-2.5 py-1 rounded-xl bg-pink-50 text-pink-700 text-[11px] font-bold border border-pink-200 truncate">
            👆 點發光處或直接點右側 ➔
          </div>
          <button onclick="onboardingTour.nextStep()" class="px-4 py-2 rounded-2xl font-black text-white bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-xs sm:text-sm shadow-lg border-2 border-white transition flex items-center gap-1 active:scale-95 cursor-pointer shrink-0 animate-bounce ring-2 ring-pink-200">
            <span>下一步 ➔</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Application Logic Scripts (Bust stale caches with version tag) -->
  <script src="./js/uiMap.js?v=1.7.9"></script>
  <script src="./js/store.js?v=1.7.9"></script>

  <!-- Register Service Worker for 100% Offline PWA functionality & Update Detection -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => {
            console.log('[PWA] Service Worker registered with scope:', reg.scope);

            // If a worker is already waiting to activate
            if (reg.waiting) {
              promptSWUpdate(reg);
              return;
            }

            // Listen for new service worker installation
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    promptSWUpdate(reg);
                  }
                });
              }
            });
          })
          .catch(err => console.error('[PWA] Service Worker registration failed:', err));
      });
    }

    function promptSWUpdate(reg) {
      if (window.appState && typeof window.appState.showSWUpdateBanner === 'function') {
        window.appState.showSWUpdateBanner(reg);
      } else {
        const existing = document.getElementById('pwa-update-banner');
        if (existing) return;
        const banner = document.createElement('div');
        banner.id = 'pwa-update-banner';
        banner.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900/95 text-white border border-pink-400 shadow-2xl backdrop-blur-md flex items-center gap-3 text-xs font-bold animate-fade-in-up';
        banner.innerHTML = `
          <span>🎉 發現新版本 ClassQuant Hub！</span>
          <button id="pwa-reload-btn" class="px-3 py-1 bg-gradient-to-r from-pink-500 to-rose-500 rounded-xl text-white font-black hover:brightness-110 active:scale-95 transition">立即更新</button>
          <button id="pwa-dismiss-btn" class="px-2 py-1 text-slate-400 hover:text-white transition">稍後</button>
        `;
        document.body.appendChild(banner);
        document.getElementById('pwa-reload-btn').addEventListener('click', () => {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          } else {
            window.location.reload();
          }
        });
        document.getElementById('pwa-dismiss-btn').addEventListener('click', () => {
          banner.remove();
        });
      }
    }
  </script>
