<!DOCTYPE html>
<html lang="zh-TW" data-theme="kitty">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ClassQuant Hub • 國中導師與數學科任戰情室</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f43f5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClassQuant">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f43f5e'/%3E%3Cpath d='M30 45 C30 35 40 28 50 28 C60 28 70 35 70 45 C70 58 60 65 50 65 C40 65 30 58 30 45 Z' fill='%23ffffff'/%3E%3Cellipse cx='42' cy='46' rx='3' ry='4.5' fill='%23222'/%3E%3Cellipse cx='58' cy='46' rx='3' ry='4.5' fill='%23222'/%3E%3Cellipse cx='50' cy='53' rx='3.5' ry='2.5' fill='%23fbbf24'/%3E%3Cpath d='M62 32 C65 26 74 26 77 31 C79 35 75 40 70 39 C72 44 68 49 63 47 C58 45 59 38 62 32 Z' fill='%23ef4444'/%3E%3Ccircle cx='66' cy='36' r='3.5' fill='%23ffedd5'/%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js CDN with BoxPlot Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.4/build/index.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Zen Maru Gothic & Nunito for Kawaii look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="./css/styles.css?v=2.1.0">
  <link rel="stylesheet" href="./css/kitty-theme.css?v=2.1.0">
  <link rel="stylesheet" href="./css/sanrio-characters.css?v=2.1.0">
  <link rel="stylesheet" href="./css/oaa-theme.css?v=2.1.0">
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300 font-sans selection:bg-pink-300 selection:text-pink-900">

  <!-- Unified Sticky Top Bar Container (Header Row 1 + Navigation Tab Row 2) -->
  <div id="top-bar-sticky-container" class="sticky top-0 z-40 bg-white/80 backdrop-blur-md">
    
    <!-- Top Global Header with Collapsible Mascot Banner (Row 1 on Desktop, 2 Rows on Mobile) -->
    <header id="global-header" class="glass-card border-b px-2.5 sm:px-6 py-2">
      <div class="max-w-7xl mx-auto space-y-2 md:space-y-0 md:flex md:items-center md:justify-between md:gap-3">
        
        <!-- Mobile Row 1 / Desktop Left: Mascots, Title, Version Badge & Mobile Collapse Button -->
        <div class="flex items-center justify-between gap-1.5 min-w-0">
          <div class="flex items-center space-x-1 sm:space-x-2 min-w-0 flex-1 overflow-hidden">
            <!-- Sanrio Mascots Box (Hidden in OAA Mode) -->
            <div id="header-mascots-box" class="flex items-center space-x-1 bg-white px-1.5 py-0.5 rounded-2xl shadow-sm border border-pink-200 shrink-0">
              <div class="kitty-cat-avatar cursor-pointer !w-7 !h-7 sm:!w-8 sm:!h-8 transition-transform active:scale-90" onclick="appState.handleMascotTap('kitty')" title="Hello Kitty"></div>
              <div class="sanrio-twinstars-badge cursor-pointer !w-7 !h-7 sm:!w-8 sm:!h-8 transition-transform active:scale-90" onclick="appState.handleMascotTap('twinstars')" title="Little Twin Stars (Kiki & Lala)"></div>
            </div>

            <!-- COTE Official Logo Box (Visible in OAA Mode, Click to Trigger Easter Egg!) -->
            <div id="header-cote-logo-box" onclick="appState.triggerCoteEasterEgg()" class="hidden items-center bg-amber-50/95 px-2 py-0.5 rounded-lg border border-amber-400/75 shadow-sm shrink-0 cursor-pointer active:scale-95 transition-transform" title="高度育成 S-SYSTEM 內部終端（點擊解鎖動漫彩蛋）">
              <img src="./assets/cote/cote_logo_s3.png" alt="ようこそ実力至上主義の教室へ" class="h-5 sm:h-6 max-w-[100px] object-contain">
            </div>

            <!-- App Title & Version Badge -->
            <div class="flex items-center space-x-1 shrink-0">
              <h1 id="app-title-text" class="text-xs sm:text-base font-black tracking-wide flex items-center gap-1 text-pink-600 shrink-0 whitespace-nowrap">
                ClassQuant
                <span class="kitty-bow !w-3 !h-3 sm:!w-3.5 sm:!h-3.5 shrink-0"></span>
              </h1>
              <button id="header-version-badge" onclick="appState.openBulletinModal()" class="text-[10px] px-1.5 py-0.5 rounded-full font-bold bg-pink-100 text-pink-700 border border-pink-300 hover:bg-pink-200 transition active:scale-95 cursor-pointer flex items-center gap-0.5 shrink-0 whitespace-nowrap" title="查看公佈欄與更新日誌">
                <span>v2.0.0</span>
                <span>📢</span>
              </button>
            </div>
          </div>

          <!-- Mobile Only: Prominent Collapse Button on Top-Right Corner (Fixed shrink-0, never overlaps version badge) -->
          <button onclick="appState.toggleHeader()" 
            class="md:hidden min-h-[36px] px-2.5 py-1 rounded-xl border border-pink-300 bg-pink-100 hover:bg-pink-200 text-pink-800 font-black text-xs transition flex items-center gap-0.5 shadow-sm shrink-0 active:scale-90 cursor-pointer whitespace-nowrap ml-1" title="收合頂部選單">
            <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
            <span>收合</span>
          </button>
        </div>

        <!-- Mobile Row 2 / Desktop Right: Class Selector Dropdown & Quick Control Tools -->
        <div class="flex items-center justify-between gap-1.5 sm:gap-2">
          <!-- Class Select Dropdown (Spacious & Clean, Never Truncated) -->
          <div class="flex items-center space-x-1.5 border border-pink-300 rounded-xl px-2.5 py-1.5 sm:py-1 shadow-inner bg-white min-w-[125px] flex-1 max-w-[260px] sm:max-w-none min-h-[38px]">
            <i data-lucide="users" class="w-3.5 h-3.5 text-pink-500 shrink-0"></i>
            <select id="global-class-select" onchange="appState.handleManualClassChange(this.value)" 
              class="bg-transparent text-xs sm:text-sm font-bold focus:outline-none cursor-pointer w-full text-slate-800 truncate pr-1">
              <!-- Populated via JS -->
            </select>
          </div>

          <!-- Quick Tools & Desktop Collapse Button -->
          <div class="flex items-center space-x-1 sm:space-x-1.5 shrink-0">
            <!-- Clock Ticker (Desktop only) -->
            <div class="hidden xl:flex items-center space-x-1 text-[11px] opacity-80 mr-1">
              <span id="header-live-clock" class="font-mono font-semibold">載入時間...</span>
              <span>•</span>
              <div id="header-schedule-status" class="flex items-center space-x-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 live-indicator"></span>
                <span class="text-emerald-600 font-bold">自動感知</span>
              </div>
            </div>

            <!-- Onboarding Tour Button (Desktop & Tablet) -->
            <button id="onboarding-guide-btn" onclick="onboardingTour.start(0)" 
              class="hidden sm:flex min-h-[38px] px-2.5 py-1 rounded-xl border border-pink-300 bg-white hover:bg-pink-50 text-pink-700 transition items-center gap-1 shadow-sm active:scale-95 shrink-0" title="開啟新手教學">
              <span class="text-xs font-black">🎓</span>
              <span class="text-xs font-bold text-pink-700 hidden md:inline">新手教學</span>
            </button>

            <!-- Sound Toggle Button -->
            <button id="sound-toggle-btn" onclick="appState.toggleSound()" 
              class="min-w-[38px] min-h-[38px] p-1.5 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center justify-center gap-1 shadow-sm bg-white shrink-0" title="操作音效切換">
              <i data-lucide="volume-2" class="w-4 h-4 text-pink-600"></i>
            </button>

            <!-- Theme Switcher Button (Sanrio vs OAA Mode) -->
            <button id="theme-toggle-btn" onclick="appState.toggleTheme()" 
              class="min-w-[38px] min-h-[38px] p-1.5 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center justify-center gap-1 shadow-sm bg-white shrink-0 cursor-pointer" title="切換風格主題 (三麗鷗 ⇋ OAA模式)">
              <span class="kitty-bow !w-3.5 !h-3.5"></span>
              <span class="text-xs font-bold text-pink-600 ml-0.5 hidden xl:inline">三麗鷗</span>
            </button>

            <!-- Font Scale Switcher Button -->
            <button id="font-scale-toggle-btn" onclick="appState.cycleFontSize()" 
              class="min-h-[38px] px-2 py-1 rounded-xl border border-pink-300 hover:bg-pink-50 transition flex items-center gap-1 shadow-sm bg-white shrink-0 cursor-pointer text-slate-700" title="切換字體大小 (標準 / 舒適 / 大字)">
              <span class="text-xs font-black">🔍A</span>
              <span class="text-xs font-bold hidden md:inline">108%</span>
            </button>

            <!-- Desktop & Tablet Collapse Button -->
            <button onclick="appState.toggleHeader()" 
              class="hidden md:flex min-w-[38px] min-h-[38px] p-1.5 rounded-xl border border-pink-300 bg-pink-100 hover:bg-pink-200 text-pink-800 font-bold text-xs transition items-center justify-center shadow-sm shrink-0 active:scale-90 cursor-pointer" title="收合頂部選單">
              <i data-lucide="chevron-up" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- Mobile Ultra-Compact Collapsed Header Strip (Visible only on <768px when top header collapsed) -->
    <div id="mobile-collapsed-bar" class="hidden md:hidden glass-card border-b px-3 py-1.5 flex items-center justify-between gap-2">
      <button type="button" onclick="appState.toggleHeader(true)" class="px-2.5 py-1 rounded-xl bg-pink-100 hover:bg-pink-200 text-pink-800 font-black text-xs border border-pink-300 transition flex items-center gap-1 shadow-sm active:scale-95 cursor-pointer shrink-0">
        <span class="kitty-bow !w-3 !h-3"></span>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
        <span>展開選單</span>
      </button>
      <span id="mobile-collapsed-class-label" class="text-xs font-black text-pink-700 truncate flex-1 text-right"></span>
    </div>

    <!-- Desktop & Tablet Navigation Tab Bar (Row 2, hidden on mobile where thumb-zone bottom bar takes over) -->
    <nav id="main-nav-bar" class="hidden md:block glass-card border-b px-3 lg:px-6 overflow-visible relative z-40">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-1.5 py-1.5">

        <div class="flex items-center space-x-1 lg:space-x-2 min-w-0 flex-nowrap overflow-x-auto no-scrollbar">
          <!-- Unobtrusive Expand Header Button (Visible only when Header is Collapsed on Tablet/Desktop) -->
          <button id="header-unhide-pill" onclick="appState.toggleHeader(true)" 
            class="hidden shrink-0 px-2.5 py-1 rounded-xl bg-pink-100/90 hover:bg-pink-200 text-pink-800 font-black text-xs border border-pink-300 transition flex items-center gap-1.5 shadow-sm active:scale-95 whitespace-nowrap cursor-pointer" title="點擊展開頂部選單">
            <span class="kitty-bow !w-3 !h-3"></span>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            <span>選單</span>
            <span class="text-[9px] px-1 py-0.2 rounded bg-pink-200/80 text-pink-900 font-mono font-bold">v2.1.0</span>
          </button>

          <!-- 1. 🎯 課堂點記 (Live Scoring + Inline Retro Log) -->
          <button onclick="appState.switchTab('matrix')" data-tab="matrix" class="nav-tab-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
            <span>🎯</span>
            <span>課堂點記</span>
          </button>

          <!-- 2. 💯 平時成績 (Grades, Exam Settlement, Excel Export & History) -->
          <button onclick="appState.switchTab('grades')" data-tab="grades" class="nav-tab-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
            <span>💯</span>
            <span>平時成績</span>
          </button>

          <!-- 3. 👥 班級與學生 (Roster, Student Profile & Events Search) -->
          <button onclick="appState.switchTab('students')" data-tab="students" class="nav-tab-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
            <span>👥</span>
            <span>班級與學生</span>
          </button>

          <!-- 4. ⚙️ 設定與備份 (Cloud Backup, Snapshots, Timetable & Theme) -->
          <button onclick="appState.switchTab('settings')" data-tab="settings" class="nav-tab-btn px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
            <span>⚙️</span>
            <span>設定與備份</span>
          </button>
        </div>

        <!-- Compact More Menu (⋯ 更多) -->
        <div id="more-menu-wrapper" class="relative shrink-0">
          <button id="more-menu-btn" type="button" onclick="appState.toggleMoreMenu(event)" data-tab="more" class="nav-tab-btn px-2.5 sm:px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1 whitespace-nowrap cursor-pointer">
            <span>⋯</span>
            <span>更多</span>
          </button>
          <div id="more-menu-dropdown" class="hidden absolute right-0 mt-1.5 w-52 rounded-2xl shadow-2xl border p-1.5 z-50 backdrop-blur-md">
            <button type="button" onclick="appState.switchTab('feedback-board'); appState.closeMoreMenu()" class="more-menu-item w-full text-left px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition cursor-pointer">
              <span>💬</span><span>師生互動板</span>
            </button>
            <button type="button" onclick="appState.switchTab('guide'); appState.closeMoreMenu()" class="more-menu-item w-full text-left px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition cursor-pointer">
              <span>📖</span><span>圖文操作說明書</span>
            </button>
            <button type="button" onclick="appState.openBulletinModal(); appState.closeMoreMenu()" class="more-menu-item w-full text-left px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition cursor-pointer">
              <span>📢</span><span>公佈欄與更新日誌</span>
            </button>
            <div class="my-1 border-t border-pink-100/60"></div>
            <button type="button" onclick="onboardingTour.start(0); appState.closeMoreMenu()" class="more-menu-item w-full text-left px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition cursor-pointer">
              <span>🎓</span><span>重新體驗互動導覽</span>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </div>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 md:p-6 pb-24 md:pb-8">
    <!-- Tab 1: Classroom Matrix View (Live Scoring + Inline Retro Log Toggle) -->
    <section id="classroom-matrix-view" class="tab-panel animate-fade-in-up"></section>
    <section id="retro-log-view" class="hidden"></section>

    <!-- Tab 2: Regular Grades, Term Settlement & Behavior Analytics View -->
    <section id="dashboard-view" class="tab-panel hidden animate-fade-in-up"></section>

    <!-- Tab 3: Unified Students & Class Management Hub -->
    <div id="students-hub-shell" class="tab-panel hidden animate-fade-in-up">
      <div id="students-hub-subnav" class="glass-card rounded-2xl p-1.5 mb-4 border shadow-sm flex flex-wrap items-center gap-1.5">
        <button type="button" data-subtab="roster" onclick="appState.switchStudentsSubTab('roster')" class="subtab-pill-btn students-subtab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 cursor-pointer">
          <span>📝</span><span>班級與名單管理</span>
        </button>
        <button type="button" data-subtab="student-dossier" onclick="appState.switchStudentsSubTab('student-dossier')" class="subtab-pill-btn students-subtab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 cursor-pointer">
          <span>👤</span><span>學生個人表現</span>
        </button>
        <button type="button" data-subtab="events" onclick="appState.switchStudentsSubTab('events')" class="subtab-pill-btn students-subtab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 cursor-pointer">
          <span>🔍</span><span>點記流水帳檢索</span>
        </button>
      </div>
      <section id="roster-manager-view" class="students-subpanel"></section>
      <section id="student-dossier-view" class="students-subpanel hidden"></section>
      <section id="events-log-view" class="students-subpanel hidden"></section>
    </div>

    <!-- Tab 4: Unified Settings, Cloud Backup & Timetable Hub -->
    <div id="settings-hub-shell" class="tab-panel hidden animate-fade-in-up">
      <div id="settings-hub-subnav" class="glass-card rounded-2xl p-1.5 mb-4 border shadow-sm flex flex-wrap items-center gap-1.5">
        <button type="button" data-subtab="ai-hub" onclick="appState.switchSettingsSubTab('ai-hub')" class="subtab-pill-btn settings-subtab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 cursor-pointer">
          <span>☁️</span><span>雲端備份與系統設定</span>
        </button>
        <button type="button" data-subtab="timetable" onclick="appState.switchSettingsSubTab('timetable')" class="subtab-pill-btn settings-subtab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center gap-1.5 cursor-pointer">
          <span>📅</span><span>課表排程設定</span>
        </button>
      </div>
      <section id="ai-hub-view" class="settings-subpanel"></section>
      <section id="timetable-editor-view" class="settings-subpanel hidden"></section>
    </div>

    <!-- Secondary Views (Accessed via ⋯ 更多 Menu) -->
    <section id="feedback-board-view" class="tab-panel hidden animate-fade-in-up"></section>
    <section id="user-guide-view" class="tab-panel hidden animate-fade-in-up"></section>
  </main>

  <!-- Mobile Thumb-Zone Bottom Tab Bar (< 768px) -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 glass-card border-t shadow-[0_-6px_24px_rgba(244,63,94,0.12)] px-1.5 pt-1 pb-[max(6px,env(safe-area-inset-bottom))]">
    <div class="grid grid-cols-5 gap-1 max-w-md mx-auto">
      <button type="button" onclick="appState.switchTab('matrix')" data-tab="matrix" class="nav-tab-btn mobile-nav-btn py-1.5 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 min-h-[50px] text-[11px] font-black transition active:scale-95 cursor-pointer">
        <span class="text-base leading-none">🎯</span>
        <span class="leading-tight whitespace-nowrap">點記</span>
      </button>
      <button type="button" onclick="appState.switchTab('grades')" data-tab="grades" class="nav-tab-btn mobile-nav-btn py-1.5 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 min-h-[50px] text-[11px] font-black transition active:scale-95 cursor-pointer">
        <span class="text-base leading-none">💯</span>
        <span class="leading-tight whitespace-nowrap">成績</span>
      </button>
      <button type="button" onclick="appState.switchTab('students')" data-tab="students" class="nav-tab-btn mobile-nav-btn py-1.5 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 min-h-[50px] text-[11px] font-black transition active:scale-95 cursor-pointer">
        <span class="text-base leading-none">👥</span>
        <span class="leading-tight whitespace-nowrap">學生</span>
      </button>
      <button type="button" onclick="appState.switchTab('settings')" data-tab="settings" class="nav-tab-btn mobile-nav-btn py-1.5 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 min-h-[50px] text-[11px] font-black transition active:scale-95 cursor-pointer">
        <span class="text-base leading-none">⚙️</span>
        <span class="leading-tight whitespace-nowrap">設定</span>
      </button>
      <button type="button" id="mobile-more-menu-btn" onclick="appState.toggleMobileMoreSheet(event)" data-tab="more" class="nav-tab-btn mobile-nav-btn py-1.5 px-1 rounded-2xl flex flex-col items-center justify-center gap-0.5 min-h-[50px] text-[11px] font-black transition active:scale-95 cursor-pointer">
        <span class="text-base leading-none">⋯</span>
        <span class="leading-tight whitespace-nowrap">更多</span>
      </button>
    </div>
  </nav>

  <!-- Mobile More Actions Bottom Sheet -->
  <div id="mobile-more-sheet" onclick="if (event.target === this) appState.closeMobileMoreSheet()" class="md:hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-xs flex items-end hidden">
    <div id="mobile-more-sheet-card" class="w-full glass-card rounded-t-3xl rounded-b-none border-t-2 p-4 pb-[max(1.25rem,env(safe-area-inset-bottom))] space-y-2 shadow-2xl">
      <div class="w-10 h-1 rounded-full bg-pink-300/70 mx-auto mb-2"></div>
      <div class="flex items-center justify-between px-1 pb-2 border-b border-pink-100/70">
        <span class="text-sm font-black">更多教學工具與資訊</span>
        <button type="button" onclick="appState.closeMobileMoreSheet()" class="w-8 h-8 rounded-full bg-pink-50 text-pink-700 font-black flex items-center justify-center cursor-pointer">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button type="button" onclick="appState.switchTab('feedback-board'); appState.closeMobileMoreSheet()" class="more-menu-item p-3 rounded-2xl border border-pink-200/70 text-left text-xs font-black flex items-center gap-2 min-h-[48px] cursor-pointer active:scale-95">
          <span class="text-lg">💬</span><span>師生互動板</span>
        </button>
        <button type="button" onclick="appState.switchTab('guide'); appState.closeMobileMoreSheet()" class="more-menu-item p-3 rounded-2xl border border-pink-200/70 text-left text-xs font-black flex items-center gap-2 min-h-[48px] cursor-pointer active:scale-95">
          <span class="text-lg">📖</span><span>圖文說明書</span>

  <!-- Register Service Worker for 100% Offline PWA functionality -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => {
            console.log('ClassQuant Hub Service Worker Registered!', reg.scope);
            // Proactively check for Service Worker updates on every launch
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New update available. Activating new Service Worker...');
                    newWorker.postMessage('SKIP_WAITING');
                  }
                });
              }
            });
          })
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
