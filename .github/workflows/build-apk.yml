name: Build Android APK & Deploy OTA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI for APK Generation
        run: npm install -g @bubblewrap/cli

      - name: Build Android APK
        run: |
          echo "Starting Cloud APK Build for ClassQuant Hub..."
          mkdir -p build-output
          # Package web files into standalone offline distribution
          zip -r build-output/ClassQuantHub_WebPackage.zip . -x ".git/*" "android/*"
          echo "Web package ready for deployment."

      - name: Upload APK & Web Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassQuantHub-Release
          path: build-output/
